name: Local Lean verifier smoke (temporary)
on:
  push:
    branches:
      - infra/lean-persistent-local-verifier-20261109
permissions:
  contents: read
jobs:
  shell-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Parse and exercise local verifier without Lean or network
        run: |
          set -Eeuo pipefail
          bash -n scripts/verify_lean_local.sh
          bash scripts/verify_lean_local.sh --help | grep -F 'Lean 4.34.1'
          output="$(LEAN_BIN=/does/not/exist LEAN_UPSTREAM=/does/not/exist bash scripts/verify_lean_local.sh 2>&1)" && exit 1 || true
          echo "$output" | grep -F 'Missing'
          test ! -e reference/lean_primitive_trace.lean
