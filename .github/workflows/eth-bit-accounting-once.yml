name: ETH operand bit accounting research gate
on:
  push:
    branches:
      - research/eth-operand-bit-accounting
    paths:
      - .github/workflows/eth-bit-accounting-once.yml
permissions:
  contents: read
jobs:
  account:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact reference and type checker
        run: python -m pip install -q -e '.[test,typecheck]'
      - name: Strict typing
        run: python -m mypy --strict --no-incremental
      - name: Exact operand replay and three-way differential
        run: PYTHONPATH=src:. python -m pytest -x -q tests/eth/test_rational_bit_accounting.py tests/eth/test_three_way_contraction.py
      - name: Capture witnessed rational bit bound on a small exact case
        run: |
          PYTHONPATH=src:. python - <<'PY'
          from benchmarks.eth.three_way_contraction import run_case
          x = run_case("path", 2, 1)
          for key, arm in x["strategies"].items():
              print(key, arm["status"], arm.get("fraction_bit_accounting", {}))
          PY
