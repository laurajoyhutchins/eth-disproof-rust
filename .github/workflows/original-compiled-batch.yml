name: Original Lean compiled-program Rust generation

on:
  pull_request:
    paths:
      - 'rust/lean_eth_reference/tools/*compiled*.py'
      - 'rust/lean_eth_reference/tools/*source*.lean'
      - 'rust/lean_eth_reference/tools/export_source_program.lean'
      - 'rust/lean_eth_reference/src/bin/lean-original-codegen.rs'
      - 'rust/lean_eth_reference/tools/*source*.py'
      - 'rust/lean_eth_reference/tools/lean_rust.py'
      - 'rust/lean_eth_reference/tools/test_lean_rust.py'
      - 'rust/lean_eth_reference/tools/test_compiler_cache_workflow.py'
      - 'rust/lean_eth_reference/tools/export_compiled_batch.py'
      - '.github/workflows/original-compiled-batch.yml'
  workflow_dispatch:
    inputs:
      name_regex:
        description: Original Lean declaration regex
        type: string
        required: true
        default: '(SqrtLog\.Setup\.(computeLProgram|logSuccProgram)|SqrtLogSpace\.DisjointReuse\.SparseFrontierProgram\.(pushProgram|initFrontierProgram|popProgram|popIfPresentProgram|pushPairProgram))'
      limit:
        description: Maximum programs to attempt
        type: number
        required: true
        default: 1
      timeout_seconds:
        description: Timeout per source program or module build
        type: number
        required: true
        default: 240

permissions:
  contents: read

# PR updates run offline regressions only. Original Lean compilation is opt-in.
concurrency:
  group: original-compiled-batch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source-tools:
    name: source-tools
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Compile Python tools and run offline tests
        run: |
          python3 -m compileall -q rust/lean_eth_reference/tools
          python3 -m unittest discover -s rust/lean_eth_reference/tools -p 'test_lean_rust.py' -v
          python3 -m unittest discover -s rust/lean_eth_reference/tools -p 'test_compiler_cache_workflow.py' -v

  original-compiled-batch:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.number == 161)
    name: source-compiled Lean machines to native Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ORIGINAL_SOURCE_SHA: 4eaee87548250b2682affda7d05d947c05554bae
      ORIGINAL_MATHLIB_SHA: d13f23b723b8a846827a245b89c10fc7d3f11612
      PINNED_ORIGINAL_SOURCE: ${{ github.workspace }}/upstream/openai-math
      LEAN_ROOT: instrumentation/lean-env
      PROGRAM_REGEX: ${{ github.event_name == 'workflow_dispatch' && inputs.name_regex || 'SparseFrontierProgram\.(pushProgram|initFrontierProgram|popProgram|popIfPresentProgram|pushPairProgram)' }}
      PROGRAM_LIMIT: ${{ inputs.limit || 5 }}
      PROGRAM_TIMEOUT: ${{ inputs.timeout_seconds || 240 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download exact original OpenAI SAT source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream/openai-math
          git -C upstream/openai-math init -q
          git -C upstream/openai-math remote add origin https://github.com/openai/math.git
          git -C upstream/openai-math sparse-checkout init --cone
          git -C upstream/openai-math sparse-checkout set lean/OAI/Algorithms/SubexponentialSAT
          git -C upstream/openai-math fetch --depth 1 --filter=blob:none origin "$ORIGINAL_SOURCE_SHA"
          git -C upstream/openai-math checkout -q --detach FETCH_HEAD
          test "$(git -C upstream/openai-math rev-parse HEAD)" = "$ORIGINAL_SOURCE_SHA"
          test -z "$(git -C upstream/openai-math status --porcelain --untracked-files=no)"
          ln -s "$GITHUB_WORKSPACE/upstream/openai-math/lean/OAI" "$LEAN_ROOT/OAI"

      - name: Run strict source scanner and export refusal regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s rust/lean_eth_reference/tools \
            -p 'test_source_compiled.py' -v
          python3 -m unittest discover -s rust/lean_eth_reference/tools \
            -p 'test_lean_rust.py' -v
          python3 rust/lean_eth_reference/tools/extract_compiled_catalog.py \
            --upstream "$PINNED_ORIGINAL_SOURCE" --query-closure \
            --output "$RUNNER_TEMP/query-compiled-candidates.json"

      - name: Restore Lean 4.34.1 and pinned Mathlib from official cache
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          lake-package-directory: instrumentation/lean-env
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          mk_all-check: false

      # Reuse the same pinned original source-closure cache as PR #145.
      # This is a pure build cache, never export or differential evidence.
      - name: Restore pinned original Lean build cache
        id: original-oai-cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: instrumentation/lean-env/.lake/build
          key: original-oai-v1-${{ runner.os }}-${{ hashFiles('instrumentation/lean-env/lean-toolchain', 'instrumentation/lean-env/lake-manifest.json') }}-4eaee87548250b2682affda7d05d947c05554bae

      # Restore only under the same original source, pinned toolchain and
      # source-exporter implementation. This is a performance cache, not proof.
      # Each program's source receipt and instruction table are validated anew.
      - name: Restore source-program checkpoints from previous GitHub runs
        id: program-cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/original-compiled
          key: original-lean-programs-v1-${{ runner.os }}-4eaee87548250b2682affda7d05d947c05554bae-${{ hashFiles('instrumentation/lean-env/lean-toolchain', 'instrumentation/lean-env/lake-manifest.json', 'rust/lean_eth_reference/tools/extract_compiled_catalog.py', 'rust/lean_eth_reference/tools/export_compiled_batch.py', 'rust/lean_eth_reference/tools/export_source_program.lean') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            original-lean-programs-v1-${{ runner.os }}-4eaee87548250b2682affda7d05d947c05554bae-${{ hashFiles('instrumentation/lean-env/lean-toolchain', 'instrumentation/lean-env/lake-manifest.json', 'rust/lean_eth_reference/tools/extract_compiled_catalog.py', 'rust/lean_eth_reference/tools/export_compiled_batch.py', 'rust/lean_eth_reference/tools/export_source_program.lean') }}-

      - name: Compile a bounded batch of authentic original programs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$LEAN_ROOT/.lake/packages/mathlib" rev-parse HEAD)" = "$ORIGINAL_MATHLIB_SHA"
          (cd "$LEAN_ROOT" && lake env lean --version)
          python3 rust/lean_eth_reference/tools/export_compiled_batch.py \
            --upstream "$PINNED_ORIGINAL_SOURCE" --lake-root "$LEAN_ROOT" \
            --output-dir "$RUNNER_TEMP/original-compiled" \
            --query-closure \
            --name-regex "$PROGRAM_REGEX" \
            --limit "$PROGRAM_LIMIT" --max-labels 4096 --timeout-seconds "$PROGRAM_TIMEOUT"

      # Store fresh immutable run-specific cache entries even after a refusal.
      # Never overwrite a previous run's cache. A new run restores the most
      # recent compatible snapshot and validates receipts before reuse.
      - name: Save source-program checkpoints for subsequent GitHub runs
        if: always()
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/original-compiled
          key: original-lean-programs-v1-${{ runner.os }}-4eaee87548250b2682affda7d05d947c05554bae-${{ hashFiles('instrumentation/lean-env/lean-toolchain', 'instrumentation/lean-env/lake-manifest.json', 'rust/lean_eth_reference/tools/extract_compiled_catalog.py', 'rust/lean_eth_reference/tools/export_compiled_batch.py', 'rust/lean_eth_reference/tools/export_source_program.lean') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save successfully built original Lean dependencies
        if: always() && steps.original-oai-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: instrumentation/lean-env/.lake/build
          key: original-oai-v1-${{ runner.os }}-${{ hashFiles('instrumentation/lean-env/lean-toolchain', 'instrumentation/lean-env/lake-manifest.json') }}-4eaee87548250b2682affda7d05d947c05554bae

      - name: Generate and typecheck executable Rust for every successful export
        shell: bash
        run: |
          set -euo pipefail
          rustc --version | grep -F 'rustc 1.99.1'
          python3 rust/lean_eth_reference/tools/compile_exported_batch.py \
            --tables "$RUNNER_TEMP/original-compiled" \
            --rust-output "$RUNNER_TEMP/original-compiled-rust" \
            --typecheck-crate "$RUNNER_TEMP/original-compiled-check" \
            --rust-crate rust/lean_eth_reference \
            --max-labels 4096
          echo 'ORIGINAL_LEAN_COMPILED_RUST=TYPECHECKED' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve source-genuine tables, Rust source and refusal ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-compiled-rust-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/query-compiled-candidates.json
            ${{ runner.temp }}/original-compiled/
            ${{ runner.temp }}/original-compiled-rust/
          if-no-files-found: warn
          retention-days: 14
