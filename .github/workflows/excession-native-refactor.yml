name: Excession native compiler refactor review

on:
  pull_request:
    paths:
      - 'compiler/backend/src/**'
      - 'compiler/frontend/**'
      - 'compiler/runtime/**'
      - 'compiler/primitive-registry.tsv'
      - 'compiler/runtime-primitive-registry.tsv'
      - 'compiler/docs/excession-refactor.md'
      - 'compiler/docs/reader-architecture.md'
      - '.github/workflows/excession-native-refactor.yml'

permissions:
  contents: read

concurrency:
  group: excession-native-refactor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-bound-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact candidate with base history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build exact Excession CLI
        run: |
          set -euo pipefail
          EXCESSION_SHA=e22f252f653506b2e42bcbfe39d8915a8cd49d14
          git init -q "$RUNNER_TEMP/excession"
          git -C "$RUNNER_TEMP/excession" remote add origin https://github.com/laurajoyhutchins/excession.git
          git -C "$RUNNER_TEMP/excession" fetch -q --depth=1 origin "$EXCESSION_SHA"
          git -C "$RUNNER_TEMP/excession" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/excession" rev-parse HEAD)" = "$EXCESSION_SHA"
          rustup toolchain install 1.99.1 --profile minimal
          rustup component add --toolchain 1.99.1 rust-analyzer rust-src
          cargo +1.99.1 build --locked --manifest-path "$RUNNER_TEMP/excession/core/Cargo.toml" --bin excession
      - name: Install integrity-pinned upstream SCIP decoder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scip-cli"
          curl -fLsS --retry 3 \
            https://github.com/scip-code/scip/releases/download/v0.10.0/scip-linux-amd64.tar.gz \
            -o "$RUNNER_TEMP/scip-cli/scip.tar.gz"
          echo 'eeb28ebbff443c01609fb1691809958f3f0c7a8651af689a5bc8560061cd8ab0  '"$RUNNER_TEMP/scip-cli/scip.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/scip-cli/scip.tar.gz" -C "$RUNNER_TEMP/scip-cli" scip
          "$RUNNER_TEMP/scip-cli/scip" --version
      - name: Locate source, inspect base, verify candidate
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/excession-native-refactor"
          mkdir -p "$OUT"
          TOOL="$RUNNER_TEMP/excession/core/target/debug/excession"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git cat-file -e "${BASE_SHA}^{commit}"
          git diff --check "$BASE_SHA" "$HEAD_SHA" -- compiler
          # Native analysis uses rust-analyzer's original Rust symbol index,
          # not the Python/JavaScript static module resolver.
          RA="$(rustup which --toolchain 1.99.1 rust-analyzer)"
          SCIP="$RUNNER_TEMP/scip-cli/scip"
          # Source roots differ only during the directory migration.
          BASE_PREFIX=compiler
          if ! git cat-file -e "${BASE_SHA}:compiler/Cargo.toml" 2>/dev/null; then
            BASE_PREFIX=rust/native_lean_backend
          fi
          HEAD_PREFIX=compiler
          HEAD_SRC=compiler/backend/src
          BASE_SRC="$BASE_PREFIX/src"
          if git cat-file -e "${BASE_SHA}:compiler/backend/src/lib.rs" 2>/dev/null; then
            BASE_SRC=compiler/backend/src
          fi
          # Run both pinned revisions in the SAME detached worktree path.
          # SCIP project_root is a physical URI; a different checkout directory
          # cannot be rebound to another repository without losing provenance.
          ANALYSIS_REPO="$RUNNER_TEMP/lean-compiler-analysis"
          git worktree add --detach "$ANALYSIS_REPO" "$BASE_SHA"
          test "$(git -C "$ANALYSIS_REPO" rev-parse HEAD)" = "$BASE_SHA"
          "$TOOL" analyze rust --repo "$ANALYSIS_REPO" --rev "$BASE_SHA" \
            --source-prefix "$BASE_PREFIX" --trusted-local true \
            --rust-analyzer "$RA" --scip "$SCIP" > "$OUT/native-rust-base.json"
          (
            cd "$ANALYSIS_REPO/$BASE_PREFIX"
            CARGO_NET_OFFLINE=true CARGO_TARGET_DIR="$OUT/base-target" \
              "$RA" scip "$PWD" --output "$OUT/base.scip"
          )
          "$SCIP" print --json "$OUT/base.scip" > "$OUT/base-index.json"
          git -C "$ANALYSIS_REPO" checkout --detach "$HEAD_SHA"
          test "$(git -C "$ANALYSIS_REPO" rev-parse HEAD)" = "$HEAD_SHA"
          "$TOOL" analyze rust --repo "$ANALYSIS_REPO" --rev "$HEAD_SHA" \
            --source-prefix "$HEAD_PREFIX" --trusted-local true \
            --rust-analyzer "$RA" --scip "$SCIP" > "$OUT/native-rust-head.json"
          (
            cd "$ANALYSIS_REPO/$HEAD_PREFIX"
            CARGO_NET_OFFLINE=true CARGO_TARGET_DIR="$OUT/head-target" \
              "$RA" scip "$PWD" --output "$OUT/head.scip"
          )
          "$SCIP" print --json "$OUT/head.scip" > "$OUT/head-index.json"
          jq -e --arg commit "$BASE_SHA" \
            '.schema == "excession.scip-observations.v1" and .source_commit == $commit and .indexer.name == "rust-analyzer"' \
            "$OUT/native-rust-base.json" >/dev/null
          jq -e --arg commit "$HEAD_SHA" \
            '.schema == "excession.scip-observations.v1" and .source_commit == $commit and .indexer.name == "rust-analyzer"' \
            "$OUT/native-rust-head.json" >/dev/null
          # Import both source-bound observations into one evidence store; all
          # subsequent agent queries consume these native relationships.
          DB="$OUT/native-evidence.sqlite"
          "$TOOL" refactor scip-ingest --repo "$ANALYSIS_REPO" --rev "$BASE_SHA" \
            --source-prefix "$BASE_PREFIX" --index "$OUT/base-index.json" --db "$DB" \
            > "$OUT/ingest-base.json"
          "$TOOL" refactor scip-ingest --repo "$ANALYSIS_REPO" --rev "$HEAD_SHA" \
            --source-prefix "$HEAD_PREFIX" --index "$OUT/head-index.json" --db "$DB" \
            > "$OUT/ingest-head.json"
          "$TOOL" refactor scip-suggest --repo "$ANALYSIS_REPO" --rev "$HEAD_SHA" \
            --source-prefix "$HEAD_PREFIX" --index "$OUT/head-index.json" \
            > "$OUT/native-refactor-candidates.json"
          "$TOOL" refactor scip-audit --repo "$ANALYSIS_REPO" --rev "$HEAD_SHA" \
            --source-prefix "$HEAD_PREFIX" --index "$OUT/head-index.json" \
            --report "$OUT/native-refactor-candidates.json" > "$OUT/native-refactor-audit.json"
          "$TOOL" agent locate --repo "$ANALYSIS_REPO" --rev "$BASE_SHA" \
            --task 'Lean compiler IR Reader decoding, expression lowering, constructor cases and module dependency closure' \
            --roots $BASE_SRC --index-segments 256 --limit 20 --json > "$OUT/locate.json"
          "$TOOL" agent context --repo "$ANALYSIS_REPO" --rev "$BASE_SHA" \
            --focus $BASE_SRC/lib.rs,$BASE_PREFIX/primitive-registry.tsv,$BASE_PREFIX/runtime-primitive-registry.tsv \
            --roots $BASE_SRC --db "$DB" --limit 32 > "$OUT/context.json"
          "$TOOL" agent context --repo "$ANALYSIS_REPO" --rev "$HEAD_SHA" \
            --focus $HEAD_SRC/lib.rs,$HEAD_SRC/reader/mod.rs,$HEAD_SRC/reader/decode.rs,$HEAD_SRC/reader/expr.rs,$HEAD_SRC/reader/cases.rs,$HEAD_SRC/reader/body.rs,$HEAD_SRC/reader/module.rs \
            --roots $HEAD_SRC --db "$DB" --limit 32 > "$OUT/context-candidate.json"
          "$TOOL" agent verify --repo "$ANALYSIS_REPO" --base "$BASE_SHA" \
            --candidate "$HEAD_SHA" --roots $HEAD_SRC --db "$DB" --limit 32 > "$OUT/verify.json"
          jq -e '.schema == "excession.agent-context.v1"' "$OUT/context.json" > /dev/null
          jq -e '.schema == "excession.agent-context.v1"' "$OUT/context-candidate.json" > /dev/null
          jq -e '.schema == "excession.agent-verification.v1"' "$OUT/verify.json" > /dev/null
          {
            echo 'Excession source-bound refactor review'
            echo "Base: $BASE_SHA"
            echo "Candidate: $HEAD_SHA"
            echo 'Rust native symbol relationships: rust-analyzer SCIP, source-bound at both revisions'
            jq -r '"Native base matched cross-file references: \(.coverage.matched_cross_file_references)"' "$OUT/native-rust-base.json"
            jq -r '"Native head matched cross-file references: \(.coverage.matched_cross_file_references)"' "$OUT/native-rust-head.json"
            echo 'Rust semantic equivalence: NOT ESTABLISHED by Excession'
            echo 'Exact-head Lean native differential gate: required independently'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve source and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excession-native-lean-refactor
          path: |
            ${{ runner.temp }}/excession-native-refactor/*.json
            ${{ runner.temp }}/excession-native-refactor/*.scip
          if-no-files-found: warn
          retention-days: 14
