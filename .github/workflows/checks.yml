name: Checkpoint
on:
  # PRs get exact-head checks. Do not redundantly trigger on feature-branch
  # pushes with a different (possibly documentation-only) diff boundary.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  checkpoint-shards:
    name: checkpoint-shard-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install verification dependencies
        run: python -m pip install -e '.[test,typecheck]'
      - name: Strict production and verification typing
        if: matrix.shard == 0
        run: |
          python -m mypy --strict --no-incremental
          python -m mypy --strict --follow-imports=silent scripts/evidence.py scripts/verify.py scripts/change_impact.py scripts/shard_contract.py scripts/aggregate_checkpoint.py scripts/cost_ledger.py build_native.py
      - name: Plan affected contracts (unknown means full)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/change_impact.py --base "$BASE_SHA" --output artifacts/pure/impact.json
      - name: Verify checkpoint shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python scripts/verify.py checkpoint --shard-count 2 --shard-index "$SHARD" --impact-plan artifacts/pure/impact.json --output artifacts/pure
      - name: Preserve pinned shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-shard-${{ matrix.shard }}
          path: artifacts/pure/
          if-no-files-found: warn

  checkpoint:
    name: checkpoint
    needs: checkpoint-shards
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: checkpoint-shard-*
          path: artifacts/shards
          merge-multiple: false
      - name: Require both shard jobs and prove exact test union
        env:
          SHARD_JOBS: ${{ needs.checkpoint-shards.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$SHARD_JOBS" = "success"
          python scripts/aggregate_checkpoint.py --root artifacts/shards --head "$HEAD_SHA" --count 2
