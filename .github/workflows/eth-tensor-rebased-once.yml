name: ETH exact tensor rebased integration gate
on:
  push:
    branches:
      - research/eth-exact-tensor-contraction
    paths:
      - .github/workflows/eth-tensor-rebased-once.yml
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test and typing dependencies
        run: python -m pip install -q -e '.[test,typecheck]'
      - name: Strict production type checking
        run: python -m mypy --strict --no-incremental
      - name: Independent exact tensor and ordering tests
        run: python -m pytest -x -q tests/eth/test_tensor_train.py tests/eth/test_tensor_bond_obstruction.py
      - name: Reproduce actual spectral and algebraic rank benchmarks
        run: |
          PYTHONPATH=src:. python -m benchmarks.eth.tensor_rank_probe
          PYTHONPATH=src:. python -m benchmarks.eth.tensor_bond_obstruction
