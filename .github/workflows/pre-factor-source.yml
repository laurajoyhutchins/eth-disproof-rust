name: Pre-factor support source snapshot
on:
  push:
    branches:
      - research/pre-factor-support-20261109
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive pinned source
        run: git archive --format=tar.gz --output pre-factor-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: pre-factor-source
          path: pre-factor-source.tar.gz
