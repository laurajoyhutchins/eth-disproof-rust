# These scenarios import the production module files *by path*. Isolating
# guard and byte decoder exposes which source dependency actually translates
# without substituting a proof-friendly implementation.
# The smallest genuine source-derived parent-decision obligation. It
# contains no diagnostic String allocation or trace-recording callback.
[scenario.ranked-parent]
backend = "lean"
include = ["ranked_source_proof_harness::representation_ranked_certificate::parent_refusal_code"]

[scenario.ranked-guard]
backend = "lean"
include = ["ranked_source_proof_harness::representation_ranked_certificate::verify_ranked_component_certificate"]

[scenario.ranked-decoder]
backend = "lean"
include = ["ranked_source_proof_harness::representation_ranked_input::decode_ranked_input"]

# Full source closure includes callback-parametric arithmetic recording;
# this must stay red until genuine source-derived Lean is generated.
[scenario.ranked-source]
backend = "lean"
include = ["ranked_source_proof_harness::representation_ranked_input::execute_ranked_wire"]

# Controlled probes: these do not replace or certify production execution.
[scenario.probe-p0]
backend = "lean"
include = ["ranked_source_proof_harness::borrow_return_probe::p0_result_only"]

[scenario.probe-p1]
backend = "lean"
include = ["ranked_source_proof_harness::borrow_return_probe::p1_direct_scalar"]

[scenario.probe-p2]
backend = "lean"
include = ["ranked_source_proof_harness::borrow_return_probe::p2_direct_result"]

[scenario.probe-p3]
backend = "lean"
include = ["ranked_source_proof_harness::borrow_return_probe::p3_optional_scalar"]

[scenario.probe-p4]
backend = "lean"
include = ["ranked_source_proof_harness::borrow_return_probe::p4_optional_result"]

[scenario.probe-p5]
backend = "lean"
include = ["ranked_source_proof_harness::borrow_return_probe::p5_checked_direct"]

[scenario.probe-p6]
backend = "lean"
include = ["ranked_source_proof_harness::borrow_return_probe::p6_checked_optional"]

[scenario.probe-p7]
backend = "lean"
include = ["ranked_source_proof_harness::borrow_return_probe::p7_checked_owned"]
