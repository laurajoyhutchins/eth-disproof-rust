name: Original accumulator full-frame Lean/Rust trace replay

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/original-accumulate-hit-miss-replay.yml'

permissions:
  contents: read
  actions: read

# One-off bounded diagnostic. The original OAI source ran separately at
# exact pinned revisions; this replay downloads its immutable trace bytes.
jobs:
  full-frame:
    name: full-frame
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_RUN_ID: '44873057634'
      SOURCE_TRACE_SHA256: 5acb635b4fbf03cadeb51c2be02cfd689c0ee996e292661bb89d2b5c283b09e2
      SOURCE_ORIGINAL_SHA: 4eaee87548250b2682affda7d05d947c05554bae
      SOURCE_TABLE_SHA256: 0af370ad3ca3f8a5a9c0a144e8ffc82c07bc9b24acd206fa3ed863d8a58d2ea3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Restore the actual pinned Lean hit/miss trace from the passing source run
        uses: actions/download-artifact@v4
        with:
          run-id: 44873057634
          github-token: ${{ github.token }}
          name: original-accumulator-hit-miss-ce2682d490c100fe7be8451d54b3187044b75c22-1
          path: ${{ runner.temp }}/original-trace

      - name: Admit exact immutable source trace bytes and source-run scope
        shell: bash
        run: |
          set -euo pipefail
          export ORIGINAL_TRACE="${{ runner.temp }}/original-trace/original.stdout.log"
          export ORIGINAL_REPORT="${{ runner.temp }}/original-trace/report.json"
          test -f "$ORIGINAL_TRACE" && test -f "$ORIGINAL_REPORT"
          test "$(sha256sum "$ORIGINAL_TRACE" | awk '{print $1}')" = "$SOURCE_TRACE_SHA256"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          receipt=json.loads(Path(os.environ["ORIGINAL_REPORT"]).read_text())
          raw=Path(os.environ["ORIGINAL_TRACE"]).read_bytes()
          assert receipt["status"]=="ORIGINAL_LEAN_HIT_MISS_FULL_TRACE_OBSERVED"
          assert receipt["original_commit"]==os.environ["SOURCE_ORIGINAL_SHA"]
          assert receipt["source_kernel_certificate"] is False
          assert receipt["lean_to_rust_correspondence"] is False
          assert receipt["trace_sha256"]==hashlib.sha256(raw).hexdigest()
          assert receipt["original_source_blob"]=="3e1664be261748c6e12a2d1cafb033dc26131bf9"
          assert receipt["original_olean_sha256"]=="ce4bb2ae26521171606f721cbfd289c31c39acf388b1573ed446b349ca7cfacd"
          assert receipt["cases"]=={
             "hit":{"steps":959,"status":"HALTED"},
             "miss":{"steps":169,"status":"HALTED"}}
          assert receipt["trace_states"]==1130
          p=receipt["params"]
          assert p["prime"]=="2" and p["exponent"]=="1"
          assert p["width"]=="2" and p["modulus"]=="010"
          assert p["coefficient"]=="10" and p["entries"]=="1"
          assert p["hit_query"]=="1" and p["miss_query"]=="0"
          assert p["hit_present"]==p["miss_absent"]==p["width_valid"]=="true"
          print("ORIGINAL_SOURCE_TRACE_ADMITTED sha256="+receipt["trace_sha256"])
          PY

      - name: Verify canonical Rust interpreter and strict observed table tests
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked
          cargo test --locked --offline -p lean-eth-reference --test original_accumulator_observed_wire -- --nocapture

      - name: Compare every original Lean source machine state with canonical Rust BitProgram.step
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original-parity"
          cargo run --locked --offline -p lean-eth-reference \
            --bin original-accumulator-observed-trace-compare -- \
            "$RUNNER_TEMP/original-trace/original.stdout.log" \
            | tee "$RUNNER_TEMP/original-parity/comparison.stdout.log"
          grep -q '^ORIGINAL_ACCUMULATE_HIT_MISS_STEP_PARITY hit_steps=959 miss_steps=169 ' \
            "$RUNNER_TEMP/original-parity/comparison.stdout.log"
          grep -q 'observation_only=true kernel_certificate=false$' \
            "$RUNNER_TEMP/original-parity/comparison.stdout.log"

      - name: Preserve exact-head differential verdict without false certification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-accumulate-full-frame-replay-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/original-parity/
          if-no-files-found: warn
          retention-days: 14
