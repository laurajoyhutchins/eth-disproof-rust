name: ETH selector projector equivalence research verification
on:
  push:
    branches:
      - research/eth-selector-projector-equivalence
    paths:
      - .github/workflows/eth-selector-projector-once.yml
permissions:
  contents: read
jobs:
  equivalence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact reference and strict checker
        run: python -m pip install -q -e '.[test,typecheck]'
      - name: Strict typecheck
        run: |
          python -m mypy --strict --no-incremental
          python -m mypy --strict --no-incremental reference/eth_measurement_basis_equivalence.py
      - name: Selector-to-projector source matrix and counting equivalence
        run: PYTHONPATH=src:. python -m pytest -x -q tests/eth/test_measurement_basis_equivalence.py tests/eth/test_projected_gram.py tests/eth/test_implicit_auxiliary.py tests/eth/test_auxiliary_construction.py
