name: CNF full-pipeline scaling
on:
  workflow_dispatch:
  push:
    branches:
      - 'verify/cnf-scaling-*'

jobs:
  growing-cnf:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact benchmark dependencies
        run: python -m pip install -e '.[test]'
      - name: Verify family identities and evidence contract
        run: python -m pytest -q tests/benchmark/test_cnf_scaling.py -m checkpoint
      - name: Verify real constructed two-variable reference and isolated worker
        run: python -m pytest -q tests/benchmark/test_cnf_scaling.py -m integration
      - name: Execute source-pinned growing family comparison
        run: |
          python -m benchmarks.eth.cnf_scaling \
            --families path matching clique \
            --sizes 2 4 6 \
            --summations tuples eliminate fused multilinear \
            --repeats 1 --timeout 8 \
            --threshold 64 --r 2 --Q 2 --R 2 \
            --output artifacts/cnf-scaling.json
      - name: Check exact CNF unfolding rank and ordering obstruction
        run: |
          python -m pytest -q tests/eth/test_unfolding_rank.py -m checkpoint
          python -m pytest -q tests/eth/test_unfolding_rank.py -m integration
          python -m benchmarks.eth.unfolding_rank \
            --max-pairs 4 \
            --output artifacts/eth-unfolding-rank.json
      - name: Preserve source-pinned exact cut-rank evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnf-unfolding-rank
          path: artifacts/eth-unfolding-rank.json
          if-no-files-found: warn
      - name: Verify symbolic all-center rank certificate and growing families
        run: |
          python -m pytest -q tests/eth/test_support_rank.py -m checkpoint
          python -m pytest -q tests/eth/test_support_rank.py -m integration
          python -m pytest -q tests/eth/test_spectral_rank_growth.py
          python -m benchmarks.eth.spectral_rank_growth \
            --families path matching xor_pairs clique \
            --sizes 3 4 5 6 --max-exact-n 4 --max-profile-n 6 \
            --output artifacts/eth-spectral-rank-growth.json
      - name: Preserve actual spectral support/rank growth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eth-spectral-rank-growth
          path: artifacts/eth-spectral-rank-growth.json
          if-no-files-found: warn
      - name: Preserve raw exact, refusal, and timeout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnf-full-pipeline-scaling
          path: artifacts/cnf-scaling.json
          if-no-files-found: warn
