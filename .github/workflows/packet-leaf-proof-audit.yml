name: Packet leaf source-cost audit
on:
  push:
    branches:
      - 'verify/packet-leaf-cert-*'
  workflow_dispatch:

jobs:
  packet-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test and typecheck dependencies
        run: python -m pip install -e '.[test,typecheck]'
      - name: Packet leaf source and existing packet oracle contracts
        run: python -m pytest -q tests/unit/test_packet_leaf_work.py tests/unit/test_packet_oracle_work_envelope.py tests/unit/test_oracle_frontier.py --durations=20
      - name: Strict typing of reference packet leaf model
        run: python -m mypy --strict --follow-imports=silent reference/packet_leaf_work.py
