name: Research mathematics LaTeX-to-Lean
on:
  push:
    branches: ['experiment/latex-to-lean-pilot']
    paths:
      - 'benchmark/latex-to-lean/research/**'
      - '.github/workflows/latex-to-lean-research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latex-lean-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate fail-closed research benchmark scorer (no model or Lean)
        run: node --test benchmark/latex-to-lean/research/summarize.test.mjs
      - name: Checkout pinned Leanify source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/Corrram/leanify.git vendor/leanify
          git -C vendor/leanify checkout --detach 134da59ae02e9fffc011a5ea89acf4320268d220
          mkdir -p evidence/research
          git -C vendor/leanify rev-parse HEAD > evidence/research/vendor.sha
          grep -qx 134da59ae02e9fffc011a5ea89acf4320268d220 evidence/research/vendor.sha
          cat vendor/leanify/lean-toolchain > evidence/research/toolchain.txt
          sha256sum benchmark/latex-to-lean/research/cases/*.tex > evidence/research/source-sha256.txt
      - name: Restore Lean 4.34.0 and pinned Mathlib
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: vendor/leanify
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          mk_all-check: false
      - name: Restore pinned Leanify build cache
        uses: actions/cache@v4
        with:
          path: vendor/leanify/.lake/build
          key: leanify-build-${{ runner.os }}-${{ runner.arch }}-4.34.0-134da59ae02e9fffc011a5ea89acf4320268d220-v1
      - name: Execute unaltered research LaTeX corpus
        id: parse_research
        shell: bash
        run: |
          set -euo pipefail
          cd vendor/leanify
          lake exe cache get
          lake build leanify
          for file in "$GITHUB_WORKSPACE"/benchmark/latex-to-lean/research/cases/*.tex; do
            id="$(basename "$file" .tex)"
            set +e
            /usr/bin/time -v -o "$GITHUB_WORKSPACE/evidence/research/${id}.time" \
              timeout 90s lake exe leanify check "$file" --claims --defined \
              > "$GITHUB_WORKSPACE/evidence/research/${id}.stdout" \
              2> "$GITHUB_WORKSPACE/evidence/research/${id}.stderr"
            status=$?
            set -e
            echo "$status" > "$GITHUB_WORKSPACE/evidence/research/${id}.exit"
          done
          cd "$GITHUB_WORKSPACE"
          node benchmark/latex-to-lean/research/summarize.mjs \
            benchmark/latex-to-lean/research evidence/research evidence/research/summary.json
      - name: Verify independent research theorems and axioms with Lean kernel
        if: ${{ always() && steps.parse_research.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          cd vendor/leanify
          /usr/bin/time -v -o "$GITHUB_WORKSPACE/evidence/research/gold.time" \
            timeout 180s lake env lean "$GITHUB_WORKSPACE/benchmark/latex-to-lean/research/oracle/ResearchGold.lean" \
            > "$GITHUB_WORKSPACE/evidence/research/gold.stdout" \
            2> "$GITHUB_WORKSPACE/evidence/research/gold.stderr"
          cat "$GITHUB_WORKSPACE/evidence/research/gold.stdout"
          test "$(grep -Ec '(depends on axioms:|does not depend on any axioms)' "$GITHUB_WORKSPACE/evidence/research/gold.stdout")" -eq 11
          ! grep -q 'sorryAx' "$GITHUB_WORKSPACE/evidence/research/gold.stdout"
      - name: Elaborate generated research Lean and prove a source-equivalence check
        shell: bash
        run: |
          set -euo pipefail
          cd vendor/leanify
          mkdir -p "$GITHUB_WORKSPACE/evidence/research/generated"
          for id in RG01 RG03 RS02 RS03 RS04 RC01 RC02 RC03; do
            ns="Research${id}"
            mkdir -p "$ns"
            cp "$GITHUB_WORKSPACE/benchmark/latex-to-lean/research/cases/${id}.tex" "$ns/article.tex"
            cmp "$GITHUB_WORKSPACE/benchmark/latex-to-lean/research/cases/${id}.tex" "$ns/article.tex"
            sha256sum "$ns/article.tex" > "$GITHUB_WORKSPACE/evidence/research/generated/${id}.sha256"
            lake exe leanify init "$ns/article.tex" --name "$ns" \
              > "$GITHUB_WORKSPACE/evidence/research/generated/${id}.init.stdout" \
              2> "$GITHUB_WORKSPACE/evidence/research/generated/${id}.init.stderr"
            lake build "$ns.Article" \
              > "$GITHUB_WORKSPACE/evidence/research/generated/${id}.build.stdout" \
              2> "$GITHUB_WORKSPACE/evidence/research/generated/${id}.build.stderr"
            cp "$ns/Article.lean" "$GITHUB_WORKSPACE/evidence/research/generated/${id}.Article.lean"
            cp "$ns/Compiled.lean" "$GITHUB_WORKSPACE/evidence/research/generated/${id}.Compiled.lean"
          done
          timeout 180s lake env lean "$GITHUB_WORKSPACE/benchmark/latex-to-lean/research/oracle/GeneratedResearch.lean" \
            > "$GITHUB_WORKSPACE/evidence/research/generated/Semantics.stdout" \
            2> "$GITHUB_WORKSPACE/evidence/research/generated/Semantics.stderr"
          cat "$GITHUB_WORKSPACE/evidence/research/generated/Semantics.stdout"
          test "$(grep -Ec 'ResearchGenerated\.[a-z0-9_]+.*(depends on axioms:|does not depend on any axioms)' "$GITHUB_WORKSPACE/evidence/research/generated/Semantics.stdout")" -eq 21
          ! grep -q 'sorryAx' "$GITHUB_WORKSPACE/evidence/research/generated/Semantics.stdout"
      - name: Kernel-audit all eight accepted research articles
        shell: bash
        run: |
          set -euo pipefail
          cd vendor/leanify
          mkdir -p "$GITHUB_WORKSPACE/evidence/research/audit"
          for id in RG01 RG03 RS02 RS03 RS04 RC01 RC02 RC03; do
            ns="Research${id}"
            original="$GITHUB_WORKSPACE/benchmark/latex-to-lean/research/cases/${id}.tex"
            cmp "$ns/article.tex" "$original"
            /usr/bin/time -v -o "$GITHUB_WORKSPACE/evidence/research/audit/${id}.time" \
              timeout 240s lake exe leanify audit "$ns/article.tex" \
              --lean "$ns/Compiled.lean" --module "$ns.Compiled" \
              > "$GITHUB_WORKSPACE/evidence/research/audit/${id}.stdout" \
              2> "$GITHUB_WORKSPACE/evidence/research/audit/${id}.stderr"
            cmp "$ns/article.tex" "$original"
            grep -Fq "'${ns}.Audit.built' depends on axioms:" \
              "$GITHUB_WORKSPACE/evidence/research/audit/${id}.stdout"
            grep -Fq "The kernel evaluated the compiler" \
              "$GITHUB_WORKSPACE/evidence/research/audit/${id}.stdout"
            ! grep -q 'sorryAx' "$GITHUB_WORKSPACE/evidence/research/audit/${id}.stdout"
            echo "Kernel compiler audit passed: ${id}"
          done
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latex-lean-research-receipts
          path: evidence/research/
          if-no-files-found: warn
