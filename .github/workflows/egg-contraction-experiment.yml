name: egg contraction experiment

on:
  pull_request:
    paths:
      - "experiments/egg-contraction-optimizer/**"
      - "eth/proofs/IndependentAffineBoundary.lean"
      - "eth/proofs/IndependentAffineRankNullity.lean"
      - "eth/proofs/IndependentAffineRowOps.lean"
      - "eth/proofs/IndependentAffinePackedRows.lean"
      - "eth/proofs/IndependentAffineTerminal.lean"
      - "eth/proofs/IndependentAffineSourceRows.lean"
      - "eth/proofs/IndependentAffineNativeAudit.lean"
      - "eth/proofs/IndependentAffineIndexToggle.lean"
      - "eth/proofs/IndependentAffineMatrixReplay.lean"
      - ".github/workflows/egg-contraction-experiment.yml"
  workflow_dispatch:

jobs:
  standalone-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test standalone experiment
        run: cargo test --manifest-path experiments/egg-contraction-optimizer/Cargo.toml
      - name: Run reproducible examples
        run: cargo run --manifest-path experiments/egg-contraction-optimizer/Cargo.toml

  affine-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Lean 4.34.1 and Mathlib
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          lake-package-directory: instrumentation/lean-env
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          mk_all-check: false
      - name: Kernel-check the affine boundary interface theorem
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat instrumentation/lean-env/lean-toolchain)" = "leanprover/lean4:v4.34.1"
          if grep -nE '\b(sorry|admit)\b' eth/proofs/IndependentAffineBoundary.lean eth/proofs/IndependentAffineRankNullity.lean eth/proofs/IndependentAffineRowOps.lean eth/proofs/IndependentAffinePackedRows.lean eth/proofs/IndependentAffineTerminal.lean eth/proofs/IndependentAffineSourceRows.lean eth/proofs/IndependentAffineNativeAudit.lean eth/proofs/IndependentAffineIndexToggle.lean eth/proofs/IndependentAffineMatrixReplay.lean; then
            echo "Unresolved proof admission" >&2
            exit 1
          fi
          cd instrumentation/lean-env
          failures=0
          for proof in \
            IndependentAffineBoundary \
            IndependentAffineRankNullity \
            IndependentAffineRowOps \
            IndependentAffinePackedRows \
            IndependentAffineTerminal \
            IndependentAffineSourceRows \
            IndependentAffineNativeAudit \
            IndependentAffineIndexToggle; do
            echo "::group::Lean proof: $proof"
            if ! lake env lean "$GITHUB_WORKSPACE/eth/proofs/${proof}.lean"; then
              failures=1
            fi
            echo "::endgroup::"
          done
          # The matrix-level theorem imports the row-operation proof as
          # a compiled, kernel-checked dependency. Do not copy its code.
          if ! lake env lean -o "$RUNNER_TEMP/IndependentAffineRowOps.olean" \
            "$GITHUB_WORKSPACE/eth/proofs/IndependentAffineRowOps.lean"; then
            failures=1
          elif ! lake env bash -c \
            'export LEAN_PATH="$1:$LEAN_PATH"; lean "$2"' bash \
            "$RUNNER_TEMP" "$GITHUB_WORKSPACE/eth/proofs/IndependentAffineMatrixReplay.lean"; then
            failures=1
          fi
          # Compile an independent Lean reference against the actual source,
          # raw transcript and interface emitted by the native Rust binary.
          # Generated data is a fixed grammar of decimal byte lists, not
          # arbitrary user-controlled Lean syntax.
          generated="$RUNNER_TEMP/affine-native-generated.lean"
          combined="$RUNNER_TEMP/affine-native-audited.lean"
          if ! cargo run --quiet \
            --manifest-path "$GITHUB_WORKSPACE/experiments/egg-contraction-optimizer/Cargo.toml" \
            -- --emit-lean-certificates > "$generated"; then
            failures=1
          elif grep -nE '\b(sorry|admit|axiom|unsafe)\b' "$generated"; then
            echo "Unsafe generated Lean witness" >&2
            failures=1
          else
            cat "$GITHUB_WORKSPACE/eth/proofs/IndependentAffineNativeAudit.lean" "$generated" > "$combined"
            echo "::group::Kernel-check actual Rust-emitted receipt corpus"
            if ! lake env lean "$combined"; then
              failures=1
            fi
            echo "::endgroup::"
          fi
          exit "$failures"
