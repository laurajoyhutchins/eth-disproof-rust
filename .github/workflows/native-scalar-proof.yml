name: Native Lean-to-Rust scalar semantics proof

on:
  pull_request:
    paths:
      - 'compiler/proofs/**'
      - 'compiler/scripts/check.sh'
      - '.github/workflows/native-scalar-proof.yml'
  push:
    branches: [main]
    paths:
      - 'compiler/proofs/**'
      - 'compiler/scripts/check.sh'
      - '.github/workflows/native-scalar-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Restore exact Lean 4.34.1
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          lake-package-directory: instrumentation/lean-env
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
          build: false
          test: false
          lint: false
          mk_all-check: false
      - name: Check all-inputs scalar fragment theorem at exact head
        shell: bash
        run: |
          set -euo pipefail
          lean_binary="$(cd instrumentation/lean-env && elan which lean)"
          "$lean_binary" --version
          test "$(cat compiler/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          "$lean_binary" compiler/proofs/ScalarOperationalRefinement.lean \
            | tee scalar-proof-kernel-receipt.txt
          if grep -Eq 'sorryAx|^error:' scalar-proof-kernel-receipt.txt; then
            echo "Unproved admission or Lean diagnostic in scalar proof" >&2
            exit 1
          fi
          echo "verified-head=${{ github.event.pull_request.head.sha || github.sha }}" >> scalar-proof-kernel-receipt.txt
      - name: Kernel-check C release source-to-physical model and axiom boundary
        shell: bash
        run: |
          set -euo pipefail
          lean_binary="$(cd instrumentation/lean-env && elan which lean)"
          "$lean_binary" compiler/proofs/ReaderCReleaseSemantics.lean \
            | tee c-release-proof-kernel-receipt.txt
          python3 - <<'PY'
          from pathlib import Path
          raw = Path("c-release-proof-kernel-receipt.txt").read_text()
          allowed = {"propext", "Quot.sound", "Classical.choice"}
          for name in ("cStep_represent", "runC_represent"):
              prefix = f"'ReaderCReleaseSemantics.{name}' "
              line = next((x.strip() for x in raw.splitlines()
                           if x.strip().startswith(prefix)), None)
              if line is None:
                  raise SystemExit(f"Missing Lean theorem receipt: {name}")
              status = line[len(prefix):]
              if status == "does not depend on any axioms":
                  used = set()
              elif status.startswith("depends on axioms: [") and status.endswith("]"):
                  used = set(status[19:-1].split(", ")) - {""}
              else:
                  raise SystemExit(f"Malformed axiom receipt for {name}: {status}")
              if not used <= allowed:
                  raise SystemExit(f"Unreviewed axioms for {name}: {used - allowed}")
          if "sorryAx" in raw or "error:" in raw:
              raise SystemExit("C release proof has errors or sorry axioms")
          print("C_RELEASE_SOURCE_TO_PHYSICAL_MODEL=KERNEL_VERIFIED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-scalar-proof-kernel-receipt
          retention-days: 30
          if-no-files-found: warn
          path: |
            scalar-proof-kernel-receipt.txt
            c-release-proof-kernel-receipt.txt
