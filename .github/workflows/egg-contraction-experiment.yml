name: egg contraction experiment

on:
  pull_request:
    paths:
      - "experiments/egg-contraction-optimizer/**"
      - "eth/proofs/IndependentAffineBoundary.lean"
      - "eth/proofs/IndependentAffineRankNullity.lean"
      - "eth/proofs/IndependentAffineRowOps.lean"
      - "eth/proofs/IndependentAffinePackedRows.lean"
      - "eth/proofs/IndependentAffineTerminal.lean"
      - "eth/proofs/IndependentAffineSourceRows.lean"
      - "eth/proofs/IndependentAffineNativeAudit.lean"
      - "eth/proofs/IndependentAffineIndexToggle.lean"
      - "eth/proofs/IndependentQuadraticLowWeight.lean"
      - "eth/proofs/IndependentSignedComposition.lean"
      - ".github/workflows/egg-contraction-experiment.yml"
  workflow_dispatch:

jobs:
  standalone-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test standalone experiment
        run: cargo test --manifest-path experiments/egg-contraction-optimizer/Cargo.toml
      - name: Run reproducible examples
        run: cargo run --manifest-path experiments/egg-contraction-optimizer/Cargo.toml

  affine-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Lean 4.34.1 and Mathlib
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          lake-package-directory: instrumentation/lean-env
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          mk_all-check: false
      - name: Kernel-check the affine boundary interface theorem
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat instrumentation/lean-env/lean-toolchain)" = "leanprover/lean4:v4.34.1"
          if grep -nE '\b(sorry|admit)\b' eth/proofs/IndependentAffineBoundary.lean eth/proofs/IndependentAffineRankNullity.lean eth/proofs/IndependentAffineRowOps.lean eth/proofs/IndependentAffinePackedRows.lean eth/proofs/IndependentAffineTerminal.lean eth/proofs/IndependentAffineSourceRows.lean eth/proofs/IndependentAffineNativeAudit.lean eth/proofs/IndependentAffineIndexToggle.lean eth/proofs/IndependentQuadraticLowWeight.lean eth/proofs/IndependentSignedComposition.lean; then
            echo "Unresolved proof admission" >&2
            exit 1
          fi
          cd instrumentation/lean-env
          failures=0
          for proof in \
            IndependentAffineBoundary \
            IndependentAffineRankNullity \
            IndependentAffineRowOps \
            IndependentAffinePackedRows \
            IndependentAffineTerminal \
            IndependentAffineSourceRows \
            IndependentAffineNativeAudit \
            IndependentAffineIndexToggle \
            IndependentQuadraticLowWeight \
            IndependentSignedComposition; do
            echo "::group::Lean proof: $proof"
            if ! lake env lean "$GITHUB_WORKSPACE/eth/proofs/${proof}.lean"; then
              failures=1
            fi
            echo "::endgroup::"
          done
          # Compile an independent Lean reference against the actual source,
          # raw transcript and interface emitted by the native Rust binary.
          # Generated data is a fixed grammar of decimal byte lists, not
          # arbitrary user-controlled Lean syntax.
          generated="$RUNNER_TEMP/affine-native-generated.lean"
          combined="$RUNNER_TEMP/affine-native-audited.lean"
          if ! cargo run --quiet \
            --manifest-path "$GITHUB_WORKSPACE/experiments/egg-contraction-optimizer/Cargo.toml" \
            -- --emit-lean-certificates > "$generated"; then
            failures=1
          elif grep -nE '\b(sorry|admit|axiom|unsafe)\b' "$generated"; then
            echo "Unsafe generated Lean witness" >&2
            failures=1
          else
            cat "$GITHUB_WORKSPACE/eth/proofs/IndependentAffineNativeAudit.lean" "$generated" > "$combined"
            echo "::group::Kernel-check actual Rust-emitted receipt corpus"
            if ! lake env lean "$combined"; then
              failures=1
            fi
            echo "::endgroup::"
          fi
          # Independently check the indexed monomials and equations emitted
          # from native signed elimination; Lean checks full integer semantics.
          if [ "$failures" -eq 0 ]; then
            signed_generated="$RUNNER_TEMP/signed-native-generated.lean"
            signed_combined="$RUNNER_TEMP/signed-native-audited.lean"
            if ! cargo run --quiet \
              --manifest-path "$GITHUB_WORKSPACE/experiments/egg-contraction-optimizer/Cargo.toml" \
              --bin emit_signed_native_oracles > "$signed_generated"; then
              failures=1
            elif grep -nE '\b(sorry|admit|axiom|unsafe)\b' "$signed_generated"; then
              echo "Unsafe generated signed Lean fixture" >&2
              failures=1
            else
              cat "$GITHUB_WORKSPACE/eth/proofs/IndependentQuadraticLowWeight.lean" \
                "$signed_generated" > "$signed_combined"
              echo "::group::Kernel-check native signed source semantics"
              if ! lake env lean "$signed_combined"; then
                failures=1
              fi
              echo "::endgroup::"
            fi
          fi
          # Import exact Rust-emitted constructor results, including refusals,
          # as data-only Lean propositions. The Lean normalization model
          # reconstructs them without trusting the Rust success flag.
          if [ "$failures" -eq 0 ]; then
            constructor_generated="$RUNNER_TEMP/quadratic-constructor-generated.lean"
            constructor_combined="$RUNNER_TEMP/quadratic-constructor-audited.lean"
            if ! cargo run --quiet \
              --manifest-path "$GITHUB_WORKSPACE/experiments/egg-contraction-optimizer/Cargo.toml" \
              --bin emit_quadratic_constructor_oracles > "$constructor_generated"; then
              failures=1
            elif grep -nE '\b(sorry|admit|axiom|unsafe)\b' "$constructor_generated"; then
              echo "Unsafe constructor oracle" >&2
              failures=1
            else
              cat "$GITHUB_WORKSPACE/eth/proofs/IndependentQuadraticLowWeight.lean" \
                "$constructor_generated" > "$constructor_combined"
              echo "::group::Kernel-check Rust-emitted quadratic constructor results"
              if ! lake env lean "$constructor_combined"; then
                failures=1
              fi
              echo "::endgroup::"
            fi
          fi
          exit "$failures"
