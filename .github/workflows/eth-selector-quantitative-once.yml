name: ETH quantitative selector subbasis proof
on:
  push:
    branches:
      - research/eth-quantitative-selector-witness
    paths:
      - .github/workflows/eth-selector-quantitative-once.yml
permissions:
  contents: read
jobs:
  quantitative:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact oracle and strict checker
        run: python -m pip install -q -e '.[test,typecheck]'
      - name: Strict production and proof typing
        run: |
          python -m mypy --strict --no-incremental
          python -m mypy --strict --no-incremental reference/eth_quantitative_selector.py
      - name: Quantitative Hoeffding and true source rowspace checks
        run: PYTHONPATH=src:. python -m pytest -x -q tests/eth/test_quantitative_selector.py tests/eth/test_measurement_basis_equivalence.py tests/eth/test_projected_gram.py
