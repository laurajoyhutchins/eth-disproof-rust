name: Native Lean 4.34.1 to Rust G0

on:
  pull_request:
    paths:
      - 'compiler/**'
      - 'compiler/cli/**'
      - 'eth/src/bin/eth-compiler.rs'
      - 'eth/src/lean_codegen.rs'
      - '.github/workflows/native-lean-rust.yml'
  push:
    branches: [main]
    paths:
      - 'compiler/**'
      - 'compiler/cli/**'
      - 'eth/src/bin/eth-compiler.rs'
      - 'eth/src/lean_codegen.rs'
      - '.github/workflows/native-lean-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-lean-rust-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-ffi-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Restore pinned Rust 1.99.1
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1

      - name: Restore locked ETH workspace dependencies
        run: cargo fetch --locked

      - name: Restore exact Lean 4.34.1 toolchain
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          # Install the pinned Lean toolchain through the already verified Lake root.
          # The native backend's standalone Lake package has no committed manifest.
          lake-package-directory: instrumentation/lean-env
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
          build: false
          test: false
          lint: false
          mk_all-check: false

      - name: Install GMP development library for source-refined Nat arithmetic
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgmp-dev

      - name: Run in-process Lean ABI, Rust codegen and executable conformance
        shell: bash
        run: |
          set -euo pipefail
          LEAN_BINARY="$(cd instrumentation/lean-env && elan which lean)"
          export LEAN_PREFIX="$(dirname "$(dirname "$LEAN_BINARY")")"
          test -f "$LEAN_PREFIX/include/lean/lean.h"
          test "$(cat compiler/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          echo "PR_HEAD=${{ github.event.pull_request.head.sha || github.sha }}"
          "$LEAN_PREFIX/bin/lean" --version
          cargo --version
          rustc --version
          (
            cd compiler
            lake build
            ./scripts/check.sh
            bash ./scripts/check-evidence.sh
            bash ./scripts/check-imported-probes.sh
            bash ./scripts/check-bundle.sh
            bash ./scripts/check-project-cli.sh
            bash ./scripts/check-native-runtime-parity.sh
            bash ./scripts/compare-c-rust.sh
            bash ./scripts/compare-c-rust-matrix.sh
            bash ./scripts/check-external-projects.sh
          )
          # The standalone lean-rust-compiler must emit one actual multi-root
          # Cargo package, using only the existing in-process native emitter.
          fixture="$GITHUB_WORKSPACE/compiler/fixtures/CompilerCli"
          package="$GITHUB_WORKSPACE/compiler/artifacts/eth-compiler-project"
          certificate="$GITHUB_WORKSPACE/compiler/artifacts/eth-compiler-project.receipt.json"
          cargo run --locked --offline --manifest-path compiler/cli/Cargo.toml --bin lean-rust-compiler -- compile \
            --backend compiler-ir \
            --source-repo "$GITHUB_WORKSPACE" \
            --source-revision "$(git rev-parse HEAD)" \
            --source-path compiler/fixtures/CompilerCli/Sample.lean \
            --source-toolchain-path compiler/fixtures/CompilerCli/lean-toolchain \
            --lake-root "$fixture" \
            --module Sample --root Sample.inc --root Sample.twice --root Sample.choose \
            --output "$package" --receipt "$certificate"
          test -s "$package/Cargo.toml"
          test -s "$package/src/lib.rs"
          test -s "$package/receipt.txt"
          cargo run --locked --offline --manifest-path compiler/cli/Cargo.toml --bin lean-rust-compiler -- verify \
            --backend compiler-ir \
            --source-repo "$GITHUB_WORKSPACE" \
            --source-revision "$(git rev-parse HEAD)" \
            --source-path compiler/fixtures/CompilerCli/Sample.lean \
            --source-toolchain-path compiler/fixtures/CompilerCli/lean-toolchain \
            --module Sample --root Sample.inc --root Sample.twice --root Sample.choose \
            --artifact "$package" --receipt "$certificate"
          jq -e '
            .backend == "compiler-ir"
            and .roots == ["Sample.inc", "Sample.twice", "Sample.choose"]
            and .backend_report.compiler == "native-lean-4.34.1"
            and .executable_approved == false
            and .checks.lean_rust_semantic_refinement == "not-established"
          ' "$certificate"
          # These are genuine Lean functions from the unmodified source
          # module, not hand-reimplemented Rust bodies.
          grep -Fq 'Generated directly from Lean IR declaration: Sample.inc' "$package/src/lib.rs"
          grep -Fq 'Generated directly from Lean IR declaration: Sample.twice' "$package/src/lib.rs"
          grep -Fq 'Generated directly from Lean IR declaration: Sample.choose' "$package/src/lib.rs"
          # Reject and invalidate certification for a mutated Cargo package.
          cp -a "$package" "$GITHUB_WORKSPACE/compiler/artifacts/eth-compiler-tampered"
          cp "$certificate" "$GITHUB_WORKSPACE/compiler/artifacts/eth-compiler-tampered.receipt.json"
          printf '\n// modified after native compilation\n' >> "$GITHUB_WORKSPACE/compiler/artifacts/eth-compiler-tampered/src/lib.rs"
          if cargo run --locked --offline --manifest-path compiler/cli/Cargo.toml --bin lean-rust-compiler -- verify \
              --backend compiler-ir \
              --source-repo "$GITHUB_WORKSPACE" \
              --source-revision "$(git rev-parse HEAD)" \
              --source-path compiler/fixtures/CompilerCli/Sample.lean \
              --source-toolchain-path compiler/fixtures/CompilerCli/lean-toolchain \
              --module Sample --root Sample.inc --root Sample.twice --root Sample.choose \
              --artifact "$GITHUB_WORKSPACE/compiler/artifacts/eth-compiler-tampered" \
              --receipt "$GITHUB_WORKSPACE/compiler/artifacts/eth-compiler-tampered.receipt.json"; then
            echo "Tampered canonical IR Cargo package accepted" >&2
            exit 1
          fi
          test ! -e compiler/artifacts/eth-compiler-tampered.receipt.json
          # Keep the exact-head provenance and all generated-code hashes in the job log.
          cat compiler/artifacts/native-smoke-receipt.txt
          cat compiler/artifacts/native-g1-evidence-receipt.txt
          cat compiler/artifacts/imported-probes/manifest.tsv
          cat compiler/artifacts/native-compiler-bundle-receipt.txt
          cat compiler/artifacts/parity-native/receipt.txt
          cat compiler/artifacts/compare-native/receipt.txt
          cat compiler/artifacts/bench-matrix/receipt.txt
          cat compiler/artifacts/external-projects/manifest.tsv
          cat compiler/artifacts/external-projects/receipt.txt
          {
            echo 'NATIVE_LEAN_G0=REAL_IN_PROCESS_FFI_AND_GENERATED_RUST'
            echo 'Lean=4.34.1'
            echo "Tested source SHA: ${{ github.event.pull_request.head.sha || github.sha }}"
            echo 'G1 general compiler and G2 ETH physical equivalence: NOT ESTABLISHED'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve exact-head combined compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-integrated-g1-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            compiler/artifacts/native-smoke-receipt.txt
            compiler/artifacts/lean-c-runtime/receipt.txt
            compiler/artifacts/lean-c-runtime/trace.txt
            compiler/artifacts/lean-c-generated-heap/receipt.txt
            compiler/artifacts/lean-c-generated-heap/trace.txt
            compiler/artifacts/lean-c-generated-heap/exact-emitter.rs
            compiler/artifacts/lcnf-capture.json
            compiler/artifacts/lcnf-capture-receipt.txt
            compiler/artifacts/lcnf-baseline.rs
            compiler/artifacts/lcnf-observed.rs
            compiler/artifacts/reader-rust-execution-receipt.txt
            compiler/artifacts/reader-rust-statement-axioms.txt
            compiler/artifacts/reader-rust-execution-inputs.txt
            compiler/artifacts/reader-rust-exec-*.rs
            compiler/artifacts/reader-rust-exec-*.expected
            compiler/artifacts/reader-rust-exec-*.actual
            compiler/artifacts/reader-rust-exec-*.mir
            compiler/artifacts/reader-rust-mir-footprint.log
            compiler/artifacts/reader-mir-soundness-axioms.txt
            compiler/artifacts/reader-mir-live-axioms.txt
            compiler/artifacts/reader-mir-cfg-*.txt
            compiler/artifacts/reader-projected-rc-axioms.txt
            compiler/artifacts/reader-transfer-credits-axioms.txt
            compiler/artifacts/reader-object-credits-axioms.txt
            compiler/artifacts/reader-heap-events-axioms.txt
            compiler/artifacts/transfer-contract-lean-ir.log
            compiler/artifacts/ownership-object-trace/receipt.txt
            compiler/artifacts/ownership-object-trace/c-*.txt
            compiler/artifacts/ownership-object-trace/c-events-*.txt
            compiler/artifacts/ownership-object-trace/rust-events-*.txt
            compiler/artifacts/ownership-object-trace/rust-*.txt
            compiler/artifacts/ownership-object-trace/OwnershipObjectTraceKernels.c
            compiler/examples/ownership-object-trace-package/src/lib.rs
            compiler/artifacts/ir-coverage.tsv
            compiler/artifacts/ir-constructor-summary.tsv
            compiler/artifacts/ir-constructors.tsv
            compiler/artifacts/primitive-conformance.tsv
            compiler/artifacts/item30-ir-probes.txt
            compiler/artifacts/item30-oracles.rs
            compiler/artifacts/item30-rejection.log
            compiler/artifacts/native-g1-evidence-receipt.txt
            compiler/artifacts/imported-probes/*
            compiler/artifacts/native-compiler-bundle-*.txt
            compiler/artifacts/native-project-cli-receipt.txt
            compiler/artifacts/eth-compiler-project/Cargo.toml
            compiler/artifacts/eth-compiler-project/src/lib.rs
            compiler/artifacts/eth-compiler-project/receipt.txt
            compiler/artifacts/eth-compiler-project.receipt.json
            compiler/artifacts/parity-native/*.txt
            compiler/artifacts/parity-native/*.tsv
            compiler/artifacts/parity-native/*.log
            compiler/artifacts/compare-native/*.tsv
            compiler/artifacts/compare-native/*.txt
            compiler/artifacts/compare-native/*.log
            compiler/artifacts/compare-native/*.time
            compiler/artifacts/compare-native/*.c
            compiler/artifacts/compare-native/*.rs
            compiler/artifacts/bench-matrix/*.tsv
            compiler/artifacts/bench-matrix/*.txt
            compiler/artifacts/bench-matrix/*.log
            compiler/artifacts/bench-matrix/*.time
            compiler/artifacts/bench-matrix/*.c
            compiler/artifacts/bench-matrix/generated-package/src/lib.rs
            compiler/artifacts/bench-matrix/generated-package/src/main.rs
            compiler/artifacts/external-projects/*.tsv
            compiler/artifacts/external-projects/*.txt
            compiler/artifacts/external-projects/*/unified-cli.*
            compiler/artifacts/external-projects/*/unified-oracle-cargo.log
            compiler/artifacts/external-projects/*/unified-cli-package/Cargo.toml
            compiler/artifacts/external-projects/*/unified-cli-package/src/lib.rs
            compiler/artifacts/external-projects/*/unified-cli-package/receipt.txt
            compiler/artifacts/external-projects/unified-cli-*.tsv
            compiler/artifacts/external-projects/unified-cli-*.txt
            compiler/artifacts/external-projects/*/*.lean
            compiler/artifacts/external-projects/*/*.txt
            compiler/artifacts/external-projects/*/*.log
            compiler/artifacts/external-projects/*/*.time
            compiler/artifacts/external-projects/*/generated.rs
            compiler/artifacts/external-projects/*/verified-crate/Cargo.toml
            compiler/artifacts/external-projects/*/verified-crate/src/*.rs
            compiler/artifacts/external-projects/*/verified-crate/tests/*.rs
            compiler/artifacts/external-projects/*/verified-crate/oracles/*.rs
            compiler/examples/ListFixture.lean
            compiler/examples/OptionDefaultFixture.lean
            compiler/examples/option-default-package/original-ir.txt
            compiler/examples/option-default-package/Cargo.toml
            compiler/examples/option-default-package/src/*.rs
            compiler/examples/option-default-package/tests/*.rs
            compiler/artifacts/external-projects/*/positive-package/Cargo.toml
            compiler/artifacts/external-projects/*/positive-package/src/*.rs
            compiler/artifacts/external-projects/*/positive-package/tests/*.rs
            compiler/artifacts/external-projects/*/fullpull-crate/Cargo.toml
            compiler/artifacts/external-projects/*/fullpull-crate/src/*.rs
            compiler/artifacts/external-projects/*/fullpull-crate/oracles/*.rs
