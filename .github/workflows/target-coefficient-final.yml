name: Exact target-coefficient decomposition verification
on:
  push:
    branches:
      - 'verify/target-coefficient-final-*'
  workflow_dispatch:
jobs:
  coefficient:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test and typecheck packages
        run: python -m pip install -e '.[test,typecheck]'
      - name: Differential coefficient extraction and packet tests
        run: python -m pytest -q tests/unit/test_target_coefficient.py tests/unit/test_packet_oracle_work_envelope.py --durations=20
      - name: Strict research code typing
        run: python -m mypy --strict --follow-imports=silent reference/target_coefficient.py benchmarks/packet_target_extraction.py
      - name: Reproduce synthetic and real packet state-count study
        run: python -m benchmarks.packet_target_extraction --repeats 2 | tee target_coefficient_results.json
      - uses: actions/upload-artifact@v4
        with:
          name: target-coefficient-state-evidence
          path: target_coefficient_results.json
