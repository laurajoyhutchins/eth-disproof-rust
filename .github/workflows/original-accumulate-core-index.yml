name: Original accumulator complete table and kernel certificate (no Meta)

on:
  pull_request:
    branches:
      - feat/query-aot-source-20261113
    paths:
      - '.github/workflows/original-accumulate-core-index.yml'
      - 'rust/lean_eth_reference/tools/query_accumulate_core_index.lean'
      - 'rust/lean_eth_reference/tools/query_core_table_acceptance.py'

permissions:
  contents: read

# Experimental source-only lookup. Preserve a typed refusal on any error.
jobs:
  indexed-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      ORIGINAL_SOURCE_SHA: 4eaee87548250b2682affda7d05d947c05554bae
      ORIGINAL_MATHLIB_SHA: d13f23b723b8a846827a245b89c10fc7d3f11612
      LEAN_ROOT: instrumentation/lean-env
      ORIGINAL_SOURCE: ${{ github.workspace }}/upstream/openai-math
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout pinned original OpenAI source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream/openai-math
          git -C upstream/openai-math init -q
          git -C upstream/openai-math remote add origin https://github.com/openai/math.git
          git -C upstream/openai-math sparse-checkout init --cone
          git -C upstream/openai-math sparse-checkout set lean/OAI/Algorithms/SubexponentialSAT
          git -C upstream/openai-math fetch --depth=1 --filter=blob:none origin "$ORIGINAL_SOURCE_SHA"
          git -C upstream/openai-math checkout -q --detach FETCH_HEAD
          test "$(git -C upstream/openai-math rev-parse HEAD)" = "$ORIGINAL_SOURCE_SHA"
          test "$(git -C upstream/openai-math hash-object lean/OAI/Algorithms/SubexponentialSAT/SqrtLog/MomentsReadoutProgramAccumulate.lean)" = 3e1664be261748c6e12a2d1cafb033dc26131bf9
          ln -s "$ORIGINAL_SOURCE/lean/OAI" "$LEAN_ROOT/OAI"

      - name: Restore pinned Lean 4.34.1 and Mathlib
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          lake-package-directory: instrumentation/lean-env
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          mk_all-check: false

      - name: Confirm toolchain and Mathlib pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$LEAN_ROOT/lean-toolchain")" = 'leanprover/lean4:v4.34.1'
          test "$(git -C "$LEAN_ROOT/.lake/packages/mathlib" rev-parse HEAD)" = "$ORIGINAL_MATHLIB_SHA"

      - name: Restore exact original module compilation cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: instrumentation/lean-env/.lake/build
          key: original-query-v2-${{ runner.os }}-${{ hashFiles('instrumentation/lean-env/lean-toolchain', 'instrumentation/lean-env/lake-manifest.json') }}-${{ env.ORIGINAL_SOURCE_SHA }}-indexed-${{ github.run_id }}
          restore-keys: |
            original-query-v2-${{ runner.os }}-${{ hashFiles('instrumentation/lean-env/lean-toolchain', 'instrumentation/lean-env/lake-manifest.json') }}-${{ env.ORIGINAL_SOURCE_SHA }}-

      # Use the canonical main verification library at an immutable commit.
      # No second physical-instruction serializer is admitted.
      - name: Restore canonical source-graph decoder and Lean certificate generator
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 6fefebfcdfefd7faef77605cf171c20ad307e718
          test "$(git rev-parse FETCH_HEAD)" = 6fefebfcdfefd7faef77605cf171c20ad307e718
          git restore --source=FETCH_HEAD --worktree -- eth/tools
          test -f eth/tools/source_graph_kernel_certificate.py
          test -f eth/tools/verify_source_graph.py

      - name: Enumerate exact source instructions and require fresh all-label Lean certificate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile rust/lean_eth_reference/tools/query_core_table_acceptance.py
          python3 rust/lean_eth_reference/tools/query_core_table_acceptance.py \
            --lake-root "$LEAN_ROOT" \
            --output-dir "$RUNNER_TEMP/acc-index" --timeout 300

      - name: Preserve exact original source instructions or typed refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-accumulator-core-index-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/acc-index/
          if-no-files-found: warn
          retention-days: 14
