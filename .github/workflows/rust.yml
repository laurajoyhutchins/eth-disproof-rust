name: Rust ETH port

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-eth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # Check the submitted source commit, including stacked PRs.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
      - name: Restore locked crate dependencies
        run: cargo fetch --locked
      - name: Formatting (workspace)
        run: cargo fmt --all -- --check
      - name: Exact Rust tests
        run: cargo test --locked --offline --all-targets
      - name: Source-graph compiler contract tests (offline)
        run: python3 -m unittest discover -s rust/lean_eth_reference/tools -p 'test_verify_source_graph.py'
      - name: Compiler-IR backend refusal contracts (offline)
        run: python3 -m unittest discover -s rust/lean_eth_reference/tools -p 'test_lean_ir_backend.py'
      - name: Shared two-path acceptance contracts (offline)
        run: python3 -m unittest discover -s rust/lean_eth_reference/tools -p 'test_lean_codegen_contract.py'
      - name: Strict Clippy
        run: cargo clippy --locked --offline --all-targets -- -D warnings
