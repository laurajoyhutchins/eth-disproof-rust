name: Sudoku representation certificates
on:
  workflow_dispatch:
  push:
    branches:
      - 'verify/sudoku-structure-*'
jobs:
  certificates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install source reference dependencies
        run: python -m pip install -e '.[test]'
      - name: Differential unit-rank and small-mode-catalog contracts
        run: python -m pytest -q tests/unit/test_sudoku_representation_rank.py -m integration
      - name: Source-faithful Sudoku geometry and rank audit
        run: python -m benchmarks.sudoku_representation_audit --boxes 2 3 4 --packing --output artifacts/sudoku-representation.json
      - name: Preserve structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-representation-certificates
          path: artifacts/sudoku-representation.json
          if-no-files-found: error
