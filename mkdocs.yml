site_name: ETH construction: mathematics and implementation
site_description: Research notes on exact #SAT counting, two-adic contraction, and Lean-to-Rust correspondence
site_url: https://laurajoyhutchins.github.io/eth-disproof-rust/
repo_url: https://github.com/laurajoyhutchins/eth-disproof-rust
repo_name: laurajoyhutchins/eth-disproof-rust
edit_uri: edit/main/
docs_dir: docs
site_dir: site
use_directory_urls: true

# Mount the canonical Markdown in research/ and rust/ into the site.
# No duplicated documentation trees or generated Markdown checked into git.
hooks:
  - tools/mkdocs_hooks.py
watch:
  - README.md
  - CONTRIBUTING.md
  - research
  - rust/lean_eth_reference/README.md
  - rust/lean_eth_reference/docs
  - rust/native_lean_backend

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Overview: index.md
  - Mathematics:
      - Questions: research/README.md
      - Research log: research/2026-10-31-to-2026-11-14-ledger.md
      - Spectral and group actions: research/spectral-group-actions.md
      - Two-adic recursion: research/two-adic-recursion.md
      - Full-pipeline costs: research/cost-model-and-benchmarks.md
      - Literature: research/literature.md
      - Formalization evaluation: research/formalization-evaluation.md
  - Execution:
      - Execution evidence: rust/lean_eth_reference/docs/evidence.md
      - Remaining Lean port: rust/lean_eth_reference/docs/remaining-lean-port.md
      - Lean–Rust acceptance: research/lean-rust-acceptance.md
      - Independent differential: rust/lean_eth_reference/docs/independent-differential-and-accounting.md
      - Source refinement: rust/lean_eth_reference/docs/m3-tm2-resource-evidence.md
      - Finite fallback: rust/lean_eth_reference/docs/m2-finite-fallback-decision.md
      - Two-path compiler contract: rust/lean_eth_reference/docs/two-path-acceptance-contract.md
  - Compiler:
      - Rust executable: rust/lean_eth_reference/README.md
      - Native frontend: rust/lean_eth_reference/docs/m2-runnable-frontend.md
      - Lean compiler IR: rust/lean_eth_reference/docs/compiler-ir-backend.md
      - Core expression residualizer: rust/lean_eth_reference/docs/core-expr-residualizer.md
      - Generalization plan: rust/lean_eth_reference/docs/lean-to-rust-generalization.md
      - Native Rust backend:
          - Introduction: rust/native_lean_backend/README.md
          - Coverage: rust/native_lean_backend/COVERAGE.md
          - Semantics: rust/native_lean_backend/SEMANTICS.md
          - Conformance: rust/native_lean_backend/CONFORMANCE.md
          - Evidence: rust/native_lean_backend/EVIDENCE.md
  - Detailed notes:
      - Documentation inventory: rust/lean_eth_reference/docs/README.md
      - Worst-case parameter study: rust/lean_eth_reference/docs/worst-case-and-polynomial-overhead.md
      - Source query table: rust/lean_eth_reference/docs/compiled-query-table.md
      - Signed signature pipeline: rust/lean_eth_reference/docs/signed-signature-pipeline.md
      - Historical sequence: rust/lean_eth_reference/docs/reading-the-history.md
      - Test accuracy audit: rust/lean_eth_reference/docs/tdd-accuracy-audit.md
  - Repository:
      - Project README: README.md
      - Contributing: CONTRIBUTING.md
      - Writing these notes: STYLE.md
      - Source on GitHub: https://github.com/laurajoyhutchins/eth-disproof-rust

# Historical port chapters remain searchable but do not crowd the sidebar.
not_in_nav: |
  /rust/lean_eth_reference/docs/
  /rust/native_lean_backend/
