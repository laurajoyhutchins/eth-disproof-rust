name: Pinned Lean finite conformance (one-off)
on:
  push:
    branches:
      - 'research/lean-source-conformance-20261109'
jobs:
  exact-finite-definitions:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run complete source-pinned finite Lean conformance
        run: python -m pytest -q tests/eth/test_lean_source_conformance.py
