name: Planner before/after evidence
on:
  pull_request:
    paths:
      - 'benchmarks/planner_ab.py'
      - '.github/workflows/planner-ab.yml'
  workflow_dispatch:

jobs:
  planner-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pure-Python research dependencies
        run: python -m pip install -e '.[test]'
      - name: Verify planner-specific properties
        run: python -m pytest -q tests/unit/test_scope_planner.py
      - name: Verify exact integration and full checkpoint without the 30s cap
        run: |
          python -m pytest -q tests/eth/test_fused_taylor.py
          python scripts/verify.py checkpoint --timeout 90 --output artifacts/planner-checkpoint
      - name: Run source-pinned ABBA performance comparison
        run: python -m benchmarks.planner_ab
      - name: Preserve performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planner-ab-evidence
          path: artifacts/planner-ab.json
          if-no-files-found: warn
