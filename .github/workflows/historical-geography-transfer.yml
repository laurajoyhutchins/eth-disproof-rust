name: GPCP historical precipitation comparison
on:
  push:
    branches: ['data-transfer/historical-geography-20261126']
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve GPCP Version 2.3 monthly data
        run: |
          mkdir out
          url='https://downloads.psl.noaa.gov/Datasets/gpcp/precip.mon.mean.nc'
          echo "$url" > out/urls.txt
          curl -fL --connect-timeout 15 --max-time 90 "$url" -o out/gpcp.nc
          python -m pip install -q numpy netCDF4
          python - <<'PY'
          import netCDF4 as nc, numpy as np, json, hashlib, calendar
          f=nc.Dataset('out/gpcp.nc'); t=f['time']; d=nc.num2date(t[:],t.units,getattr(t,'calendar','standard'))
          ix=[i for i,v in enumerate(d) if (1983,7)<=(v.year,v.month)<=(2005,6)]
          assert len(ix)==264
          p=f['precip']; assert p.dimensions==('time','lat','lon') and p.units.lower() in ('mm/day','mm day-1','mm/d'),p.units
          a=p[ix,:,:]; assert a.shape==(264,72,144),a.shape
          days=np.array([calendar.monthrange(d[i].year,d[i].month)[1] for i in ix])
          a=a*days[:,None,None]
          means=np.stack([np.ma.mean(a[[k for k,i in enumerate(ix) if d[i].month==m]],axis=0).filled(np.nan) for m in range(1,13)])
          counts=np.stack([np.sum(~np.ma.getmaskarray(a[[k for k,i in enumerate(ix) if d[i].month==m]]),axis=0) for m in range(1,13)])
          np.savez_compressed('out/gpcp-climatology.npz',lat=f['lat'][:],lon=f['lon'][:],precip=means,counts=counts)
          with open('out/provenance.json','w') as o:json.dump(dict(source_sha256=hashlib.file_digest(open('out/gpcp.nc','rb'),'sha256').hexdigest(),source_attributes={k:str(f.getncattr(k)) for k in f.ncattrs()},precip_attributes={k:str(p.getncattr(k)) for k in p.ncattrs()},months=[str(d[i]) for i in ix],method='daily rate times actual days in each month, then calendar-month mean'),o,indent=2)
          PY
          rm out/gpcp.nc
          (cd out && sha256sum * > SHA256SUMS.tmp && mv SHA256SUMS.tmp SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: gpcp-historical-comparison
          path: out/
          retention-days: 5
