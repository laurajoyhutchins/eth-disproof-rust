name: ETH operand-bit full typed benchmark confirmation
on:
  push:
    branches:
      - research/eth-operand-bit-accounting
    paths:
      - .github/workflows/eth-bit-accounting-once.yml
permissions:
  contents: read
jobs:
  account:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact reference and type checker
        run: python -m pip install -q -e '.[test,typecheck]'
      - name: Strict typing
        run: |
          python -m mypy --strict --no-incremental
          python -m mypy --strict --no-incremental benchmarks/eth/rational_bit_accounting.py benchmarks/eth/three_way_contraction.py
      - name: Exact operand replay and three-way differential
        run: PYTHONPATH=src:. python -m pytest -x -q tests/eth/test_rational_bit_accounting.py tests/eth/test_three_way_contraction.py
      - name: Reproduce complete sparse, dense and ordering-sensitive bit accounting
        run: |
          PYTHONPATH=src:. python -m benchmarks.eth.three_way_contraction > /tmp/eth-three-way-bit.json
          python - <<'PY'
          import json
          with open('/tmp/eth-three-way-bit.json', encoding='utf8') as handle:
              all_cases = json.load(handle)['cases']
          for case in all_cases:
              print("CASE", case['family'], case['formula_variables'], case['polynomial_order'])
              for name, arm in case['strategies'].items():
                  trace = arm['fraction_bit_accounting']
                  print("ARM", name, arm['status'], trace.get('reference_schoolbook_bit_steps_upper_bound'),
                        trace.get('observed_rational_method_calls'),
                        trace.get('euclidean_gcd_division_steps'),
                        trace.get('maximum_reference_intermediate_integer_bits'),
                        trace.get('uncovered_fraction_methods'),
                        arm['elapsed_seconds'])
          PY
