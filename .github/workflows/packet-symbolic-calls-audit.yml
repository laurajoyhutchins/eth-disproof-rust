name: Packet symbolic ring-call proof audit
on:
  push:
    branches:
      - 'verify/packet-symbolic-calls-*'
  workflow_dispatch:

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install verification and typing
        run: python -m pip install -e '.[test,typecheck]'
      - name: Targeted source correspondence, packet and recurrence tests
        run: python -m pytest -q tests/unit/test_packet_leaf_work.py tests/unit/test_packet_oracle_work_envelope.py tests/unit/test_oracle_frontier.py tests/unit/test_whole_frame_recurrence.py tests/integration/test_oracle_lineage_recurrence.py --durations=15
      - name: Strict source reference typing
        run: python -m mypy --strict --follow-imports=silent reference/packet_leaf_work.py reference/paper_packet_calls.py reference/whole_frame_recurrence.py
