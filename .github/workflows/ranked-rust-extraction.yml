name: Experimental ranked Rust-to-Lean extraction

on:
  pull_request:
    paths:
      - 'verification/ranked-source/hax.toml'
      - 'verification/ranked-source/src/lib.rs'
      - 'eth/src/representation_ranked_input.rs'
      - 'eth/src/representation_ranked_certificate.rs'
      - '.github/workflows/ranked-rust-extraction.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ranked-rust-extract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Reuse pinned hax frontend executable
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-hax
          key: pinned-cargo-hax-v0.4.2-ubuntu24-rust199

      - name: Install and verify pinned hax frontend
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo-hax >/dev/null 2>&1; then
            cargo install --version 0.4.2 --locked cargo-hax
          fi
          cargo hax --version | tee "$RUNNER_TEMP/hax-version.txt"
          grep -Fx 'version=0.4.2' "$RUNNER_TEMP/hax-version.txt"

      - name: Extract actual guard, decoder and complete execution source
        shell: bash
        run: |
          set -euo pipefail
          cd verification/ranked-source
          # Each target imports the same production source files. A passing
          # extraction is still not a Lean theorem. Run every target even
          # when another fails, preserving the exact unsupported closure.
          status=0
          for scenario in ranked-guard ranked-decoder ranked-source; do
            if cargo hax extract "$scenario" --locked 2>&1 | tee "$RUNNER_TEMP/$scenario-extraction.log"; then
              echo "EXTRACTION_$scenario=PASS" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "EXTRACTION_$scenario=BLOCKED" >> "$GITHUB_STEP_SUMMARY"
              status=1
            fi
          done
          exit "$status"

      - name: Preserve extraction receipts and source-derived Lean
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranked-rust-lean-source-extraction
          path: |
            verification/ranked-source/proofs/ranked-guard/lean/
            verification/ranked-source/proofs/ranked-decoder/lean/
            verification/ranked-source/proofs/ranked-source/lean/
          if-no-files-found: warn
          retention-days: 7
