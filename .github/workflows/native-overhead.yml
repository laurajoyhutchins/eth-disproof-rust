name: Native overhead diagnostic

on:
  push:
    branches:
      - 'verify/native-overhead-*'
  workflow_dispatch:

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install diagnostic dependencies
        run: |
          python -m pip install 'setuptools>=65'
          python -m pip install -e '.[native,test,benchmark]'
      - name: Rebuild extensions
        run: python build_native.py --force
      - name: Verify native mathematical equivalence
        run: python -m pytest -q tests/contracts/test_native_kernel_differential.py tests/integration/test_recursive_optimized.py
      - name: Profile native packet and leaf paths
        run: python -m scripts.native_overhead_probe artifacts/native-overhead.json
      - name: Compare full-path packet behavior
        env:
          SUDOKU_RECURSIVE_PAIRS: 'parity-2wire:reference,parity-2wire:packet,sudoku-4wire:reference,sudoku-4wire:packet,sudoku-8wire:reference,sudoku-8wire:packet,nested-2wire:reference,nested-2wire:packet,crossing-4wire:reference,crossing-4wire:packet'
          SUDOKU_BENCHMARK_ROUNDS: '7'
        run: python -m pytest -q tests/benchmark/test_recursive_timing.py --benchmark-only --benchmark-save-data --benchmark-json=artifacts/packet-fastpath-timing.json
      - name: Retain diagnostic data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-overhead-diagnostic
          path: |
            artifacts/native-overhead.json
            artifacts/packet-fastpath-timing.json
          if-no-files-found: warn
