# Release/scheduled/manual native verification on Cloud Build.
# Keep the fast checkpoint as the PR gate; this longer suite runs separately.
steps:
  - id: admit-source
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -ceu
      - |
        expected='$COMMIT_SHA'
        [[ "$$expected" =~ ^[0-9a-f]{40}$$ ]]
        test "$$expected" = '$REVISION_ID'
        test -d .git
        test "$$(git rev-parse HEAD)" = "$$expected"
        test -z "$$(git status --porcelain --untracked-files=no)"
  - id: native-integration
    name: python:3.13-bookworm
    entrypoint: bash
    waitFor: ['admit-source']
    args:
      - -ceu
      - |
        python -m pip install --disable-pip-version-check -e '.[test,native,flint-oracle,sat-oracle,math-audit,symmetry-graph]'
        python -m pip install --disable-pip-version-check 'setuptools>=65'
        python build_native.py
        python scripts/verify.py checkpoint --timeout 120 --require-native --require-native-attestation --require-backend flint --require-backend ganak --output artifacts/native
        python scripts/verify.py integration --timeout 600 --require-native --output artifacts/native
        python scripts/verify.py extended --timeout 600 --require-native --require-native-attestation --output artifacts/native
        python - <<'PY'
        import hashlib
        from pathlib import Path
        for p in sorted(Path('artifacts/native').rglob('*')):
            if p.is_file():
                print('native_evidence_sha256', hashlib.sha256(p.read_bytes()).hexdigest(), p)
        PY
timeout: 2400s
options:
  logging: CLOUD_LOGGING_ONLY
