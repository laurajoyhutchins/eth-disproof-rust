name: Packet degree zero source-certification audit
on:
  push:
    branches:
      - 'verify/packet-degree-zero-*'
  workflow_dispatch:
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test and typing
        run: python -m pip install -e '.[test,typecheck]'
      - name: Packet degree and existing recursive math regression
        run: python -m pytest -q tests/unit/test_packet_degree_zero.py tests/unit/test_packet_oracle_work_envelope.py tests/unit/test_recursive_hotpath.py --durations=20
      - name: Strict production typing
        run: python -m mypy --strict --no-incremental src/non_exponential_sudoku
