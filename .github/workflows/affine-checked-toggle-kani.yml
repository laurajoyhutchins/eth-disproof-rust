name: affine checked toggle Kani verification

on:
  pull_request:
    paths:
      - "experiments/egg-contraction-optimizer/src/affine_cert.rs"
      - "experiments/egg-contraction-optimizer/Cargo.toml"
      - ".github/workflows/affine-checked-toggle-kani.yml"
  workflow_dispatch:

# Deliberately independent of the fast Rust/Lean checkpoint workflow.
# This is a deep, bounded machine-code model check of the actual Rust
# slice-update primitive, not a universal proof of BTreeMap or Rust.
jobs:
  checked-mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Model-check native Rust checked mutation (Kani 0.68.0)
        uses: model-checking/kani-github-action@v1
        with:
          kani-version: "0.68.0"
          command: cargo-kani
          working-directory: ./experiments/egg-contraction-optimizer
