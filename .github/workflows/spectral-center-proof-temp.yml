name: Spectral separated-center proof check (temporary)
on:
  pull_request:
    paths:
      - 'reference/eth_separated_center_budget.py'
      - 'tests/eth/test_separated_center_budget.py'
      - '.github/workflows/spectral-center-proof-temp.yml'
jobs:
  spectral-source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test,typecheck]'
      - name: Strict check research and tests
        run: python -m mypy --strict --follow-imports=silent reference/eth_separated_center_budget.py tests/eth/test_separated_center_budget.py
      - name: Independent spectral construction and center oracle
        run: python -m pytest -q -o addopts='' tests/eth/test_separated_center_budget.py
