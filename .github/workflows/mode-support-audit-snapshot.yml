name: Mode-support audit source snapshot
on:
  push:
    branches:
      - research/mode-support-audit-snapshot-20261109
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Archive reproducible source
        run: git archive --format=tar.gz --output mode-support-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: mode-support-source
          path: mode-support-source.tar.gz
