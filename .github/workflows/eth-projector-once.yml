name: ETH projector exact full-count measurement

on:
  push:
    branches:
      - research/eth-spectral-origin-readout
    paths:
      - .github/workflows/eth-projector-once.yml

permissions:
  contents: read

jobs:
  exact-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exact restricted-projector benchmark
        run: |
          PYTHONPATH=src:. python -m benchmarks.eth.projector_probe
