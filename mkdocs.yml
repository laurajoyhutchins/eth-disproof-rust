site_name: "ETH construction: mathematics and implementation"
site_description: Research notes on exact #SAT counting, two-adic contraction, and Lean-to-Rust correspondence
site_url: https://laurajoyhutchins.github.io/eth-disproof-rust/
repo_url: https://github.com/laurajoyhutchins/eth-disproof-rust
repo_name: laurajoyhutchins/eth-disproof-rust
edit_uri: edit/main/
docs_dir: docs
site_dir: site
use_directory_urls: true

# Mount the canonical Markdown in research/ and rust/ into the site.
# No duplicated documentation trees or generated Markdown checked into git.
hooks:
  - tools/mkdocs_hooks.py
watch:
  - README.md
  - CONTRIBUTING.md
  - research
  - eth/README.md
  - eth/docs
  - compiler

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Overview: index.md
  - Mathematics:
      - Questions: research/README.md
      - Research log: research/2026-10-31-to-2026-11-14-ledger.md
      - Spectral and group actions: research/spectral-group-actions.md
      - Two-adic recursion: research/two-adic-recursion.md
      - Full-pipeline costs: research/cost-model-and-benchmarks.md
      - Literature: research/literature.md
      - Formalization evaluation: research/formalization-evaluation.md
  - Execution:
      - Execution evidence: eth/docs/evidence.md
      - Remaining Lean port: eth/docs/remaining-lean-port.md
      - Lean–Rust acceptance: research/lean-rust-acceptance.md
      - Independent differential: eth/docs/independent-differential-and-accounting.md
      - Source refinement: eth/docs/m3-tm2-resource-evidence.md
      - Finite fallback: eth/docs/m2-finite-fallback-decision.md
      - Two-path compiler contract: eth/docs/two-path-acceptance-contract.md
  - Compiler:
      - Backend-first architecture: compiler/docs/backend-first-architecture.md
      - Current implementation status: compiler/docs/compiler-status.md
      - Using the native compiler: eth/docs/compiler-ir-backend.md
      - Execution runtime contract: compiler/docs/execution-runtime-contract.md
      - Native compiler README: compiler/README.md
      - IR coverage: compiler/COVERAGE.md
      - Value semantics: compiler/SEMANTICS.md
      - Source conformance: compiler/CONFORMANCE.md
      - Comparison with Lean C: compiler/COMPARISON.md
      - Execution evidence: compiler/EVIDENCE.md
      - Optional compiler bootstrap: lean-rust-replacement.md
  - ETH source execution:
      - Rust machine: eth/README.md
      - Native frontend: eth/docs/m2-runnable-frontend.md
      - Core expression residualizer: eth/docs/core-expr-residualizer.md
      - Original program generalization: eth/docs/lean-to-rust-generalization.md
  - Detailed notes:
      - Documentation inventory: eth/docs/README.md
      - Worst-case parameter study: eth/docs/worst-case-and-polynomial-overhead.md
      - Source query table: eth/docs/compiled-query-table.md
      - Signed signature pipeline: eth/docs/signed-signature-pipeline.md
      - Historical sequence: eth/docs/reading-the-history.md
      - Test accuracy audit: eth/docs/tdd-accuracy-audit.md
  - Repository:
      - Project README: README.md
      - Contributing: CONTRIBUTING.md
      - Writing these notes: STYLE.md
      - Source on GitHub: https://github.com/laurajoyhutchins/eth-disproof-rust

# Historical port chapters remain searchable but do not crowd the sidebar.
not_in_nav: |
  /eth/docs/
  /compiler/
