name: egg contraction experiment

on:
  pull_request:
    paths:
      - "experiments/egg-contraction-optimizer/**"
      - "eth/proofs/IndependentAffineBoundary.lean"
      - ".github/workflows/egg-contraction-experiment.yml"
  workflow_dispatch:

jobs:
  standalone-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test standalone experiment
        run: cargo test --manifest-path experiments/egg-contraction-optimizer/Cargo.toml
      - name: Run reproducible examples
        run: cargo run --manifest-path experiments/egg-contraction-optimizer/Cargo.toml

  affine-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Lean 4.34.1 and Mathlib
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          lake-package-directory: instrumentation/lean-env
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          mk_all-check: false
      - name: Kernel-check the affine boundary interface theorem
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat instrumentation/lean-env/lean-toolchain)" = "leanprover/lean4:v4.34.1"
          if grep -nE '\b(sorry|admit)\b' eth/proofs/IndependentAffineBoundary.lean; then
            echo "Unresolved proof admission" >&2
            exit 1
          fi
          cd instrumentation/lean-env
          lake env lean "$GITHUB_WORKSPACE/eth/proofs/IndependentAffineBoundary.lean"
