name: egg contraction experiment

on:
  pull_request:
    paths:
      - "experiments/egg-contraction-optimizer/**"
      - "eth/proofs/IndependentAffineBoundary.lean"
      - "eth/proofs/IndependentLivePortComposition.lean"
      - "eth/proofs/IndependentLivePortFold.lean"
      - "eth/proofs/IndependentOverlappingFactors.lean"
      - "eth/proofs/IndependentAffineNativeAudit.lean"
      - "eth/proofs/IndependentAffineMultiplicity.lean"
      - "eth/proofs/IndependentAffineRankNullity.lean"
      - "eth/proofs/IndependentAffineTerminalSoundness.lean"
      - "eth/proofs/IndependentAffineRowOps.lean"
      - "eth/proofs/IndependentAffinePackedRows.lean"
      - ".github/workflows/egg-contraction-experiment.yml"
  workflow_dispatch:

jobs:
  standalone-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test standalone experiment
        run: cargo test --manifest-path experiments/egg-contraction-optimizer/Cargo.toml
      - name: Run reproducible examples
        run: cargo run --manifest-path experiments/egg-contraction-optimizer/Cargo.toml
      - name: Run exact counting CLI smoke case
        shell: bash
        run: |
          set -euo pipefail
          printf 'p cnf 3 2\n1 -2 0\n-1 2 0\n' | cargo run --quiet --manifest-path experiments/egg-contraction-optimizer/Cargo.toml --bin exact-cnf-count -- - | grep -F '"count":"4"'

      - name: Run contraction-order study and check small-case oracle
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --manifest-path experiments/egg-contraction-optimizer/Cargo.toml --bin affine-order-study -- --sizes 6,8,16,32,64 --summaries-only | tee /tmp/affine-order-receipts.jsonl
          grep -F '"oracle":"checked"' /tmp/affine-order-receipts.jsonl
          grep -F '"order":"even-first"' /tmp/affine-order-receipts.jsonl

  affine-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Lean 4.34.1 and Mathlib
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          lake-package-directory: instrumentation/lean-env
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          mk_all-check: false
      - name: Kernel-check the affine boundary interface theorem
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat instrumentation/lean-env/lean-toolchain)" = "leanprover/lean4:v4.34.1"
          if grep -nE '\b(sorry|admit)\b' eth/proofs/IndependentAffineBoundary.lean eth/proofs/IndependentAffineRankNullity.lean eth/proofs/IndependentAffineTerminalSoundness.lean eth/proofs/IndependentAffineRowOps.lean eth/proofs/IndependentAffinePackedRows.lean eth/proofs/IndependentLivePortComposition.lean eth/proofs/IndependentLivePortFold.lean eth/proofs/IndependentOverlappingFactors.lean eth/proofs/IndependentAffineNativeAudit.lean eth/proofs/IndependentAffineMultiplicity.lean; then
            echo "Unresolved proof admission" >&2
            exit 1
          fi
          cd instrumentation/lean-env
          lake env lean "$GITHUB_WORKSPACE/eth/proofs/IndependentAffineBoundary.lean"
          lake env lean "$GITHUB_WORKSPACE/eth/proofs/IndependentAffineRankNullity.lean"
          lake env lean "$GITHUB_WORKSPACE/eth/proofs/IndependentAffineTerminalSoundness.lean"
          lake env lean "$GITHUB_WORKSPACE/eth/proofs/IndependentAffineRowOps.lean"
          lake env lean "$GITHUB_WORKSPACE/eth/proofs/IndependentAffinePackedRows.lean"
          lake env lean "$GITHUB_WORKSPACE/eth/proofs/IndependentLivePortComposition.lean"
          lake env lean "$GITHUB_WORKSPACE/eth/proofs/IndependentLivePortFold.lean"
          lake env lean "$GITHUB_WORKSPACE/eth/proofs/IndependentOverlappingFactors.lean"
          lake env lean "$GITHUB_WORKSPACE/eth/proofs/IndependentAffineNativeAudit.lean"
          lake env lean "$GITHUB_WORKSPACE/eth/proofs/IndependentAffineMultiplicity.lean"
          # Data terms emitted by the real typed Rust producer and checked
          # using the independent auditor ported unchanged from PR #360.
          generated="$RUNNER_TEMP/ordered-affine-generated.lean"
          audited="$RUNNER_TEMP/ordered-affine-audited.lean"
          cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/experiments/egg-contraction-optimizer/Cargo.toml" -- --emit-lean-certificates > "$generated"
          if grep -nE '\b(sorry|admit|axiom|unsafe)\b' "$generated"; then
            echo "Unsafe generated Lean evidence" >&2
            exit 1
          fi
          cat "$GITHUB_WORKSPACE/eth/proofs/IndependentAffineNativeAudit.lean" "$generated" > "$audited"
          lake env lean "$audited"
