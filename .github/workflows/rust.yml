name: Rust ETH port

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR checkpoints; retain every pushed main commit receipt.
concurrency:
  group: rust-eth-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # Preserve exact-head evidence; merge-commit tests are a separate obligation.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # rust-toolchain.toml pins Rust 1.99.1, rustfmt and Clippy.
      - name: Restore locked crate dependencies
        run: cargo fetch --locked
      - name: Formatting (workspace)
        run: cargo fmt --all -- --check
      - name: Exact Rust tests
        run: cargo test --locked --offline --all-targets
      - name: Source-graph compiler contract tests (offline)
        run: |
          python3 -m unittest discover -s rust/lean_eth_reference/tools -p 'test_verify_source_graph.py'
          python3 -m unittest discover -s rust/lean_eth_reference/tools -p 'test_query_stream_aot.py' -v
      - name: Strict Clippy
        run: cargo clippy --locked --offline --all-targets -- -D warnings
