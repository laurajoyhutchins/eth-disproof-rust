name: Original QueryStream modular source extraction

on:
  # One scoped experimental branch run; not a recurring main/PR deep gate.
  push:
    branches:
      - feat/query-modular-source-extraction-20261120
    paths:
      - '.github/workflows/original-query-modules.yml'
  # Bounded one-off proof probe, only when this workflow itself changes.
  # This also provides a PR-triggered path if a connector push does not queue.
  pull_request:
    paths:
      - '.github/workflows/original-query-modules.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: 'One actual original source module; never the entire QueryStream import'
        type: choice
        required: true
        default: moments_readout
        options:
          - moments_readout
          - node_readout
          - node_append
          - node_finish
          - reconstruction

permissions:
  contents: read

# Manual, source-pinned and intentionally independent of routine PR checkpoints.
# One module per attempt avoids combining every original QueryStream dependency
# with the exporter in the same live Lean process.
concurrency:
  group: query-modular-source-${{ github.ref }}-${{ inputs.stage || 'moments_readout' }}
  cancel-in-progress: false

jobs:
  original-module:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ORIGINAL_SOURCE_SHA: 4eaee87548250b2682affda7d05d947c05554bae
      ORIGINAL_MATHLIB_SHA: d13f23b723b8a846827a245b89c10fc7d3f11612
      PINNED_ORIGINAL_SOURCE: ${{ github.workspace }}/upstream/openai-math
      LEAN_ROOT: instrumentation/lean-env
      QUERY_MODULE_STAGE: ${{ inputs.stage || 'moments_readout' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check finite modular extraction contracts offline
        run: |
          python3 -m compileall -q eth/tools/query_modular_extract.py
          python3 -m unittest discover -s eth/tools -p 'test_query_modular_extract.py' -v

      - name: Checkout pinned original OpenAI SAT source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream/openai-math
          git -C upstream/openai-math init -q
          git -C upstream/openai-math remote add origin https://github.com/openai/math.git
          git -C upstream/openai-math sparse-checkout init --cone
          git -C upstream/openai-math sparse-checkout set lean/OAI/Algorithms/SubexponentialSAT
          git -C upstream/openai-math fetch --depth 1 --filter=blob:none origin "$ORIGINAL_SOURCE_SHA"
          git -C upstream/openai-math checkout -q --detach FETCH_HEAD
          test "$(git -C upstream/openai-math rev-parse HEAD)" = "$ORIGINAL_SOURCE_SHA"
          test -z "$(git -C upstream/openai-math status --porcelain --untracked-files=no)"
          ln -s "$PINNED_ORIGINAL_SOURCE/lean/OAI" "$LEAN_ROOT/OAI"

      - name: Restore pinned Lean 4.34.1 and Mathlib
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          lake-package-directory: instrumentation/lean-env
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true
          build: false
          test: false
          lint: false
          mk_all-check: false

      - name: Restore original source compiler cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: instrumentation/lean-env/.lake/build
          key: query-modular-${{ runner.os }}-${{ hashFiles('instrumentation/lean-env/lean-toolchain', 'instrumentation/lean-env/lake-manifest.json') }}-${{ env.ORIGINAL_SOURCE_SHA }}
          restore-keys: |
            original-query-v2-${{ runner.os }}-${{ hashFiles('instrumentation/lean-env/lean-toolchain', 'instrumentation/lean-env/lake-manifest.json') }}-${{ env.ORIGINAL_SOURCE_SHA }}-
            original-oai-v1-${{ runner.os }}-${{ hashFiles('instrumentation/lean-env/lean-toolchain', 'instrumentation/lean-env/lake-manifest.json') }}-${{ env.ORIGINAL_SOURCE_SHA }}

      # Symbolic graph extraction permits large source label spaces; the
      # certificate generator remains capped at 4096 actual physical labels.
      # This single experimental-branch push is the original-source probe.
      - name: Independently export and certify one original source module
        shell: bash
        run: |
          set -euo pipefail
          python3 eth/tools/query_modular_extract.py \
            --upstream "$PINNED_ORIGINAL_SOURCE" \
            --lake-root "$LEAN_ROOT" \
            --output-dir "$RUNNER_TEMP/query-modular-source" \
            --stages "$QUERY_MODULE_STAGE" \
            --build-timeout 900 --export-timeout 300 \
            --cert-timeout 300 --max-source-labels 1000000000 \
            --rss-limit-gib 12

      - name: Preserve exact module graph, certificate or typed refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-query-module-${{ inputs.stage || 'moments_readout' }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/query-modular-source/
          if-no-files-found: warn
          retention-days: 14
