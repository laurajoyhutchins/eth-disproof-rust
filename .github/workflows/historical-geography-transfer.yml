name: Census 2000 public geography transfer
on:
  push:
    branches: ['data-transfer/historical-geography-20261126']
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch official Census 2000 county boundaries
        run: |
          mkdir out
          url=https://www2.census.gov/geo/tiger/PREVGENZ/co/co00shp/co99_d00_shp.zip
          curl -fL --retry 2 --connect-timeout 15 --max-time 90 "$url" -o out/co99_d00_shp.zip
          unzip -tq out/co99_d00_shp.zip
          echo "$url" > out/urls.txt
          (cd out && sha256sum co99_d00_shp.zip urls.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: census-2000-county
          path: out/
          retention-days: 5
