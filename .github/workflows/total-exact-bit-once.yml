name: Exact total CNF bit model edge-case verification
on:
  push:
    branches:
      - research/total-exact-bit-model
    paths:
      - .github/workflows/total-exact-bit-once.yml
permissions:
  contents: read
jobs:
  total:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install independent oracle and types
        run: python -m pip install -q -e '.[test,typecheck]'
      - name: Strict reference typing
        run: python -m mypy --strict --no-incremental reference/total_exact_cnf.py
      - name: Exact totality and symbolic bounds
        run: PYTHONPATH=src:. python -m pytest -x -q tests/unit/test_total_exact_cnf.py
