name: Native Lean to Rust (in-process)

on:
  pull_request:
    paths:
      - 'rust/native_lean_backend/**'
      - '.github/workflows/native-lean-rust.yml'
  push:
    branches: [main]
    paths:
      - 'rust/native_lean_backend/**'
      - '.github/workflows/native-lean-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-lean-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Restore pinned Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
      - name: Restore pinned Lean (no Mathlib or large-project build)
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          lake-package-directory: rust/native_lean_backend
          auto-config: false
          use-mathlib-cache: false
          use-github-cache: false
          build: false
          test: false
      - name: Install GMP development library for generated Nat runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgmp-dev
      - name: Check Lean package
        working-directory: rust/native_lean_backend
        run: lake build
      - name: Native FFI and independent Lean/Rust differential verification
        working-directory: rust/native_lean_backend
        run: |
          set -euo pipefail
          export LEAN_PREFIX="$(lean --print-prefix)"
          ./scripts/check.sh
      - name: Publish exact-head evidence in run summary
        if: success()
        working-directory: rust/native_lean_backend
        run: |
          {
            echo '### Native Lean/Rust verification'
            echo '```text'
            head -n 7 artifacts/native-smoke-receipt.txt
            echo '```'
            echo 'Full source and generated-code SHA-256 hashes are in the job logs.'
          } >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/native-smoke-receipt.txt
