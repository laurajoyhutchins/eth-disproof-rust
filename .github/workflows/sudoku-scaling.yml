name: Sudoku full-input scaling
on:
  workflow_dispatch:
  push:
    branches:
      - 'verify/sudoku-scaling-*'

jobs:
  bounded-scaling:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact reference dependencies
        run: python -m pip install -e '.[test]'
      - name: Check full-input oracle and refusal contracts
        run: python -m pytest -q tests/benchmark/test_sudoku_scaling.py
      - name: Measure 4x4 9x9 16x16 and difficult 9x9
        run: |
          python -m benchmarks.sudoku_scaling \
            --cases 4x4-empty 4x4-8-givens-four-solutions 9x9-73-givens-four-solutions 9x9-hard-unique 16x16-252-givens-two-solutions 16x16-248-givens-eight-holes \
            --algorithms frontier paper --repeats 3 --timeout 30 \
            --output artifacts/sudoku-scaling.json
      - name: Print bounded outcome counts
        if: success()
        run: |
          python -c 'import json; r=json.load(open("artifacts/sudoku-scaling.json")); print(r["status"], r["outcome_counts"], "all_solved=", r["all_cases_solved"]); [print(x["summary"]["case"], x["summary"]["algorithm"], x["summary"]["outcome"], x["summary"]["median_duration_ns_by_arm"], x["summary"]["instrumentation_walltime_ratio"]) for x in r["measurements"]]'
      - name: Preserve full raw measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-scaling-evidence
          path: artifacts/sudoku-scaling.json
          if-no-files-found: warn
