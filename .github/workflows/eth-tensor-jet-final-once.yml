name: ETH tensor Taylor final exact-head research verification
on:
  push:
    branches:
      - research/eth-tensor-taylor-jets
    paths:
      - .github/workflows/eth-tensor-jet-final-once.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact verification dependencies
        run: python -m pip install -q -e '.[test,typecheck]'
      - name: Strict typing
        run: python -m mypy --strict --no-incremental
      - name: Exact ring and Hermite tests
        run: PYTHONPATH=src:. python -m pytest -x -q tests/eth/test_tensor_jet.py
      - name: Reproduce higher-order spectral benchmark
        run: PYTHONPATH=src:. python -m benchmarks.eth.tensor_jet_probe
