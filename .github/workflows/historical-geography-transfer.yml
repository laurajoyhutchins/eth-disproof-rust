name: Public climate map and errata evidence
on:
  push:
    branches: ['data-transfer/historical-geography-20261126']
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch public corroborating images and errata
        run: |
          mkdir out
          fetch() {
            printf '%s %s\n' "$1" "$2" >> out/urls.txt
            curl -fL --connect-timeout 10 --max-time 35 "$2" -o "out/$1" || { rm -f "out/$1"; echo "$1 failed" >> out/failures.txt; }
          }
          fetch world-handbook.jpg 'https://handbook.ashrae.org/Handbooks/A19/IP/a19_ch24/figures/A24_f13.jpg'
          fetch county-handbook.jpg 'https://handbook.ashrae.org/Handbooks/A19/IP/a19_ch24/figures/A24_f14.jpg'
          fetch 2019-errata-20210408.pdf 'https://www.ashrae.org/file%20library/technical%20resources/standards%20and%20guidelines/standards%20errata/errata%20for%20ashrae-ies%20standard%2090/90.1-2019-ip-erratasheet-4-8-2021-.pdf'
          (cd out && sha256sum * > SHA256SUMS.tmp && mv SHA256SUMS.tmp SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: climate-map-errata-evidence
          path: out/
          retention-days: 5
