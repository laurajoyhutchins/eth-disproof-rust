name: Native Lean 4.34.1 to Rust G0

on:
  pull_request:
    paths:
      - 'rust/native_lean_backend/**'
      - '.github/workflows/native-lean-rust.yml'
  push:
    branches: [main]
    paths:
      - 'rust/native_lean_backend/**'
      - '.github/workflows/native-lean-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-lean-rust-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-ffi-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Restore pinned Rust 1.99.1
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1

      - name: Restore exact Lean 4.34.1 toolchain
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          # Install the pinned Lean toolchain through the already verified Lake root.
          # The native backend's standalone Lake package has no committed manifest.
          lake-package-directory: instrumentation/lean-env
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
          build: false
          test: false
          lint: false
          mk_all-check: false

      - name: Run in-process Lean ABI, Rust codegen and executable conformance
        shell: bash
        run: |
          set -euo pipefail
          LEAN_BINARY="$(cd instrumentation/lean-env && elan which lean)"
          export LEAN_PREFIX="$(dirname "$(dirname "$LEAN_BINARY")")"
          test -f "$LEAN_PREFIX/include/lean/lean.h"
          test "$(cat rust/native_lean_backend/lean-toolchain)" = 'leanprover/lean4:v4.34.1'
          echo "PR_HEAD=${{ github.event.pull_request.head.sha || github.sha }}"
          "$LEAN_PREFIX/bin/lean" --version
          cargo --version
          rustc --version
          (
            cd rust/native_lean_backend
            lake build
            ./scripts/check.sh
            bash ./scripts/check-evidence.sh
            bash ./scripts/check-imported-probes.sh
            bash ./scripts/check-bundle.sh
            bash ./scripts/check-native-runtime-parity.sh
          )
          # Keep the exact-head provenance and all generated-code hashes in the job log.
          cat rust/native_lean_backend/artifacts/native-smoke-receipt.txt
          cat rust/native_lean_backend/artifacts/native-g1-evidence-receipt.txt
          cat rust/native_lean_backend/artifacts/imported-probes/manifest.tsv
          cat rust/native_lean_backend/artifacts/native-compiler-bundle-receipt.txt
          cat rust/native_lean_backend/artifacts/parity-native/receipt.txt
          {
            echo 'NATIVE_LEAN_G0=REAL_IN_PROCESS_FFI_AND_GENERATED_RUST'
            echo 'Lean=4.34.1'
            echo "Tested source SHA: ${{ github.event.pull_request.head.sha || github.sha }}"
            echo 'G1 general compiler and G2 ETH physical equivalence: NOT ESTABLISHED'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve exact-head combined compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-integrated-g1-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            rust/native_lean_backend/artifacts/native-smoke-receipt.txt
            rust/native_lean_backend/artifacts/ir-coverage.tsv
            rust/native_lean_backend/artifacts/native-g1-evidence-receipt.txt
            rust/native_lean_backend/artifacts/imported-probes/*
            rust/native_lean_backend/artifacts/native-compiler-bundle-*.txt
            rust/native_lean_backend/artifacts/parity-native/*.txt
            rust/native_lean_backend/artifacts/parity-native/*.tsv
            rust/native_lean_backend/artifacts/parity-native/*.log
