name: ETH factorized Taylor one-off benchmark

on:
  push:
    branches:
      - research/eth-spectral-origin-readout
    paths:
      - .github/workflows/eth-factorized-once.yml

permissions:
  contents: read

jobs:
  exact-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Exact factorized Taylor versus tuple oracle
        run: |
          PYTHONPATH=src:. python -m benchmarks.eth.factorized_taylor_probe
