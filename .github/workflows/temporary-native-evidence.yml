name: Temporary exact-head native evidence check
on:
  push:
    branches:
      - test/lean-rust-native-count-evidence-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-and-observer:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: rust/lean_eth_reference
    steps:
      - uses: actions/checkout@v4
      - name: Use Rust 1.99.1
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
      - name: Compile and execute all Rust tests
        run: cargo test --locked --offline --all-targets
      - name: Python comparator mutation tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check only new source formatting (inherited baseline still unformatted)
        run: |
          rustfmt --edition 2024 --check --config skip_children=true \
            src/native_terminal_count.rs \
            src/bin/eth-terminal-count.rs \
            src/bin/profile-full-machine.rs \
            tests/native_terminal_count_e2e.rs \
            tests/bit_program_adversarial.rs
      - name: Strict Clippy
        run: cargo clippy --locked --offline --all-targets -- -D warnings
