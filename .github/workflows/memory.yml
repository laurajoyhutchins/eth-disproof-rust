name: Memory study
on:
  workflow_dispatch:
  push:
    branches:
      - 'verify/memory-*'

jobs:
  memory-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python measurement requirements
        run: python -m pip install -e '.[test]'
      - name: Repeated isolated RSS and Python allocation measurements
        run: python -m benchmarks.memory_study --repeats 3 --timeout 45 --output artifacts/memory-study.json
      - name: Show evidence in workflow log
        if: success()
        run: python -m json.tool artifacts/memory-study.json
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-study
          path: artifacts/memory-study.json
          if-no-files-found: warn
